# pnpm 11 reads allowBuilds, pnpm 10 reads onlyBuiltDependencies — keep both
# so either version runs the postinstalls this project actually needs.
# A packages list is required for `pnpm list` (electron-builder's collector).
packages:
  - "."
  - "apps/docs"
  - "cloudflare/control-plane"
# Packaging needs the optional native binaries for both macOS CPU targets
# (e.g. @trycua/cua-driver-darwin-{arm64,x64}). pnpm 10 also accepted this in
# package.json's "pnpm" field; pnpm 11 ignores that field, so it lives here.
supportedArchitectures:
  cpu:
    - arm64
    - x64
allowBuilds:
  electron: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  electron-winstaller: false # unused — Windows builds ship NSIS
onlyBuiltDependencies:
  - electron
  - esbuild
# Baileys declares `sharp` as a non-optional peer, but only touches it for image
# thumbnails and falls back to jimp (pure JS). Mark it optional so pnpm's
# auto-install-peers does not pull in a native, per-arch binary. See
# lanes/whatsapp-oauth/WHATSAPP-DESIGN.md section 1.3.
packageExtensions:
  baileys@7.0.0-rc14:
    peerDependenciesMeta:
      sharp:
        optional: true
# Security floor (GHSA libvips/libheif/librsvg): every sharp copy, including the
# one nested under @huggingface/transformers that server/image-*.ts load at runtime.
overrides:
  sharp: ">=0.35.5"
  # mermaid 12.1 still allows dompurify 3.4.13. Force the patched release.
  dompurify: 3.4.17
  # osv Highs with a fix inside the same major (1.0.4 U12). Range-scoped, so each
  # copy moves only to its own patched release. js-yaml also ships inside the
  # vendored electron-updater (it parses the update feed).
  "@xmldom/xmldom@<0.8.15": 0.8.15
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2 <2.1.7": 2.1.7
  "brace-expansion@>=5 <5.0.11": 5.0.11
  "fast-uri@>=3 <3.1.7": 3.1.7
  "js-yaml@>=4 <4.3.2": 4.3.2
  "source-map-js@<1.2.2": 1.2.2
  "undici@>=7 <7.29.1": 7.29.1
  # Left as is, on purpose: adm-zip 0.5.18 (fixed only in 0.6, outside the
  # range onnxruntime-node asks for) is used only by onnxruntime-node's install
  # script, which never runs here (not in allowBuilds); http-cache-semantics
  # 4.2.0 has no fixed release and is reached only by electron-builder
  # downloading Electron at build time.
