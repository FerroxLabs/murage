<svg xmlns="http://www.w3.org/2000/svg" width="560" height="96" viewBox="0 0 560 96" role="img" aria-labelledby="t">
<!-- Murage brand mark. The swirl is lucide `galaxy` (ISC). Forge Orange
     #ff6b35 is styles.css:122, the unmodified brand value. -->
  <title id="t">Murage</title>
  <rect width="96" height="96" rx="21.5" fill="#000000"/>
  <g transform="translate(19.20 19.20) scale(2.40000)" fill="none" stroke="#ff6b35"
     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
  <path d="M16.005 15.108a5.041 6.52 28.25 00-8.008-6.217 5.041 6.52 28.25 008.008 6.217A11.884 7.288-60.76 014.029 7.001"/>
    <path d="M17 21h.01"/>
    <path d="M7 3h.01"/>
    <path d="M7.997 8.891a11.885 7.288-60.756 0111.977 8.107"/>
    <circle cx="12" cy="12" r="1" fill="#ff6b35" stroke="none"/>
  </g>
  <!-- Sora 800 is the heaviest weight the family ships. Kept as TEXT so the
       wordmark stays selectable and re-weightable; the app self-hosts Sora.
       For a context without the font, outline this before use. -->
  <text x="128.6" y="70.6" font-family="Sora, sans-serif" font-weight="800"
        font-size="69.1" letter-spacing="-1.5" fill="#111111">MURAGE</text>
</svg>
