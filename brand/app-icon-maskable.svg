<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="t d">
<!-- Murage MASKABLE icon. Full-bleed ground on purpose: Android and iOS crop
     this to their own shape, so a squircle baked in here would be cropped twice
     and read as a rounded rect floating inside a circle. The glyph sits at 44%,
     well inside the 80% safe zone every masker guarantees. -->
  <title id="t">Murage</title>
  <desc id="d">A galaxy in Forge Orange, full-bleed black.</desc>
