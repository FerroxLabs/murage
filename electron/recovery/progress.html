<!doctype html>
<html lang="en" data-skin="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Setting up your first backup</title>
  <link rel="stylesheet" href="progress.css">
  <script src="progress.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">MURAGE</p>
    <h1 id="heading">Setting up your first backup</h1>
    <p id="lede">Murage closes for a moment so your whole workspace is copied while nothing is changing. It reopens by itself.</p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" id="bar"><span id="fill"></span></div>
    <ol id="steps">
      <li data-step="1">Checking your backup folder and recovery key</li>
      <li data-step="2">Copying and locking your workspace</li>
      <li data-step="3">Checking the backup can be opened</li>
      <li data-step="4">Reopening Murage</li>
    </ol>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
