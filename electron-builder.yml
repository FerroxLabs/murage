appId: com.murage.app
productName: Murage
artifactName: Murage-${version}-${arch}.${ext}

protocols:
  - name: Murage package install
    schemes: [murage]

# In-app auto-update reads latest-mac.yml + the .zip (macOS) or latest.yml +
# the NSIS .exe (Windows) from this PUBLIC releases repo (separate from the
# source repo). Public → no token on users' machines. Baked into
# app-update.yml; both metadata files are emitted here even with
# --publish never, and must be uploaded to the GitHub release alongside the
# artifacts — a release missing latest.yml leaves every Windows install
# stranded on its installed version.
publish:
  - provider: github
    owner: FerroxLabs
    repo: murage-releases

directories:
  buildResources: build
  output: release

# electron-builder makes copied directories group-writable by default. The
# Linux CUA trust boundary requires root-owned package ancestors to be 0755.
afterPack: ./scripts/after-pack.mjs

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/Murage Speech.app/**"
  - "!electron/resources/recorder-helper"
  - "!electron/resources/recorder-helper.swift"
  - "!electron/resources/recorder-helper-Info.plist"
  - "!electron/resources/Murage Recorder.app/**"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  # Ship the app's own license terms in every desktop distribution.
  - from: LICENSE
    to: licenses/Murage-LICENSE.txt
  - from: NOTICE
    to: licenses/Murage-NOTICE.txt
  # cloudflared is distributed under Apache-2.0 as a separate executable.
  # Murage itself uses the same full license text; ship another named
  # copy so the third-party executable's terms remain unambiguous.
  - from: LICENSE
    to: licenses/cloudflared-LICENSE.txt
  - from: third_party/cloudflared/README.md
    to: licenses/cloudflared-README.md
  # fuigo is Ferrox Labs' own engine, derived from the Apache-2.0 licensed
  # xai-org/grok-build. Murage itself uses the same full license text; ship
  # another named copy so the bundled executable's terms remain unambiguous,
  # plus the upstream third-party notices its release build embeds.
  - from: LICENSE
    to: licenses/fuigo-LICENSE.txt
  - from: third_party/fuigo/README.md
    to: licenses/fuigo-README.md
  - from: third_party/fuigo/THIRD_PARTY_NOTICES.md
    to: licenses/fuigo-THIRD_PARTY_NOTICES.md
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # The shipped skill catalog installSkillFromLibrary reads every time someone
  # hires a bot or a team. 67 MB / 4,411 files verbatim, ~20 MB compressed in
  # each artifact. Without it MURAGE_SKILL_LIBRARY points at an absent
  # directory and every hire installs zero skills.
  - from: skills-library
    to: skills-library
  # the companion sidecar — a separate process because it is the only part
  # of the app that listens off this machine, and it stays off until asked
  - from: dist-companion
    to: companion
  - from: skills
    to: skills
  - from: dist-native/android-platform-tools
    to: android-platform-tools

mac:
  # Two single-arch artifacts rather than one universal binary: the app is
  # ~177 MB per arch, and universal would make every user download both halves.
  # electron-updater picks by filename (arm64-marked files on Apple silicon,
  # unmarked ones on Intel), so latest-mac.yml must list all four files.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: electron/resources/Murage Speech.app
      to: Murage Speech.app
    - from: electron/resources/Murage Recorder.app
      to: Murage Recorder.app
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for macOS arm64.
    # ${arch} resolves per built arch — each bundle carries its own natives
    - from: dist-native/${arch}/cua-driver
      to: cua-driver
    - from: dist-native/${arch}/cua-sdk
      to: cua-sdk
    - from: dist-native/cloudflared/darwin-${arch}/cloudflared
      to: cloudflared/cloudflared
    # The bundled Fuigo engine, so a fresh install has a working engine with
    # no Node, npm or npx on the machine. ${arch} selects the staged target,
    # never the build host. `to:` MUST stay <MURAGE_FUIGO_DIR>/fuigo — see
    # electron/harness-resources.mjs, which is what the server reads.
    - from: dist-native/fuigo/darwin-${arch}/fuigo
      to: fuigo/fuigo
  extendInfo:
    NSMicrophoneUsageDescription: Murage uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: Murage transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: Murage uses Accessibility when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: Murage uses Screen Recording so bots can see this Mac before acting.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  # ${arch} is load-bearing: without it the x64 dmg silently overwrites
  # the arm64 one when both arches build (this section overrides both the
  # top-level and mac-level artifactName, so it must carry the arch itself)
  artifactName: Murage-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  extraResources:
    - from: dist-native/cloudflared/win32-x64/cloudflared.exe
      to: cloudflared/cloudflared.exe
    - from: dist-native/fuigo/win32-x64/fuigo.exe
      to: fuigo/fuigo.exe
  # Signed with Azure Trusted Signing (Microsoft now calls the role "Artifact
  # Signing"). Auth comes from AZURE_TENANT_ID / AZURE_CLIENT_ID /
  # AZURE_CLIENT_SECRET on the build env, never from this file.
  #
  # publisherName must match the certificate subject EXACTLY. Trusted Signing
  # issues short-lived (3-day) certificates that rotate constantly, but the
  # subject CN stays stable, which is the part electron-updater checks:
  #   CN="Ferrox Labs, LLC", O="Ferrox Labs, LLC", L=Austin, S=Texas, C=US
  # If that subject ever changes, list BOTH the old and new names here or every
  # already-installed user is stranded on a dead update channel.
  # publisherName lives ONLY inside azureSignOptions — electron-builder 26
  # removed win.publisherName, and a stray one fails the whole config for
  # every platform, not just Windows.
  azureSignOptions:
    publisherName: Ferrox Labs, LLC
    endpoint: https://eus.codesigning.azure.net
    codeSigningAccountName: ferrox-labs-signing
    certificateProfileName: ferroxlabs

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Murage
  # Versioned, like the .dmg. The README's /latest/download/ button needs a
  # STABLE filename, so ship a second copy named Murage-setup.exe on the
  # release — the same trick as Murage.dmg beside Murage-${version}.dmg.
  artifactName: Murage-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: build/icon.svg
  category: Utility
  executableName: murage
  synopsis: Your own team of AI bots, in a chat app
  description: A local-first chat app for running a team of AI agents.
  maintainer: Ferrox Labs <sean@ferroxlabs.com>
  vendor: Murage
  syncDesktopName: true
  # The reviewed x64 CLI runtime is staged before packaging and remains
  # outside ASAR so executable modes and adjacent sidecars are preserved.
  extraResources:
    - from: dist-native/cua-linux-x64
      to: cua-linux-x64
    - from: dist-native/cloudflared/linux-x64/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/fuigo/linux-x64/fuigo
      to: fuigo/fuigo
  desktop:
    entry:
      Name: Murage
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageCategory: utils
  priority: optional
  # dpkg can preserve legacy directory modes during an upgrade. This
  # idempotent hook repairs only the exact package-owned CUA path.
  afterInstall: build/linux-after-install.sh

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
