name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Chat UI (src/)
        - Harness server / API (server/)
        - Provider drivers (claude / codex / grok)
        - Computer use (cloud box / local)
        - Connected apps
        - Desktop shell / packaging (electron/)
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Opened the Computer panel on a fresh bot
        2. Expected the box to provision
        3. Got a spinner forever; the server log says …
    validations:
      required: true
  - type: input
    attributes:
      label: Version and install
      description: >-
        The app version is shown in Settings, General, Updates (it starts
        with "Murage" and a number). Tell us your operating system and
        whether you installed the app or run it from source.
      placeholder: Murage 0.1.60 · macOS 15.5 · installed app
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: >-
        The app keeps its logs in one folder. Open server.log from there and
        paste the last part of it here.
        On a Mac the folder is ~/Library/Logs/murage (in Finder use Go, Go to
        Folder and paste that). On Windows it is %APPDATA%\murage\logs (paste
        that into the File Explorer address bar). On Linux it is
        ~/.config/murage/logs. You can also use Settings, General,
        Diagnostics, Export Diagnostics to save a report with the log tail.
        Before you share anything, remove anything that looks like a key,
        token or password.
      render: text
