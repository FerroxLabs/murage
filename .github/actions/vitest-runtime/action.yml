# What a Vitest run needs on a hosted runner after `pnpm install`: shared by
# ci.yml (the per-push shards) and nightly.yml (the nightly-tagged tests), so
# both run the suite against the same runtime.
name: Vitest runtime
description: Prepare the pinned memory model, Electron, backup fixtures, server bundle and native test helpers.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/linux-cage
      if: runner.os == 'Linux'
    - name: Restore the pinned local memory test model
      # Keyed on the hash-pinned manifest; the prepare step below still
      # verifies every file's size and SHA-256 and downloads only what is missing.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.planning/memory-evidence/model
        key: memory-model-${{ hashFiles('shared/memory-model-manifest.json') }}
    - name: Prepare the pinned local memory test model
      # P06 executes real offline inference; a clean runner must prepare the
      # hash-pinned fixture before tests, not skip it or fetch during inference.
      shell: bash
      run: node --experimental-strip-types scripts/qualify-memory-runtime.ts --prepare-model --allow-download --destination "${{ github.workspace }}/.planning/memory-evidence/model"
    - name: Prepare Electron test runtime
      shell: bash
      run: node --input-type=commonjs -e "require('electron')"
    - name: Stage pinned backup test fixtures
      # Test-only: hash-pinned upstream age/restic bytes that backup tests read
      # or execute, plus this host's age tools for MURAGE_BACKUP_TEST_AGE_DIR
      # where a pin exists. Packaging stages its own copies.
      shell: bash
      run: node scripts/prepare-backup-test-fixtures.mjs --tool-directory "$RUNNER_TEMP/backup-test-age" >> "$GITHUB_ENV"
    - name: Build the server bundle that packaged-layout tests import
      shell: bash
      run: pnpm build:server
    - name: Node headers for the engine-exclusion addon
      # The hosted Windows Node has no include/node folder; scripts/build-engine-exclusion.mjs needs node_api.h. Fetch the headers
      # of the running Node and check them against the published SHASUMS256.txt.
      if: runner.os == 'Windows'
      shell: bash
      run: |
        v=$(node -p process.version)
        dir="$(cygpath -u "$RUNNER_TEMP")/node-headers"; mkdir -p "$dir"
        curl -fsSL "https://nodejs.org/dist/$v/node-$v-headers.tar.gz" -o "$dir/h.tgz"
        curl -fsSL "https://nodejs.org/dist/$v/SHASUMS256.txt" -o "$dir/sums"
        (cd "$dir" && want=$(grep " node-$v-headers.tar.gz\$" sums | cut -d' ' -f1) && echo "$want  h.tgz" | sha256sum -c - && tar xzf h.tgz)
        echo "NODE_HEADERS_DIR=$(cygpath -w "$dir/node-$v/include/node")" >> "$GITHUB_ENV"
    - name: Build the engine-exclusion addon
      # server/engine-exclusion*.test.ts run the REAL addon (dist-native/engine-exclusion/<os>-<arch>) and skip when it is absent;
      # a runner that skipped them would prove nothing, so build it first, as package:<os> does, and print the receipt.
      shell: bash
      run: |
        pnpm build:engine-exclusion
        cat dist-native/engine-exclusion/*/build.json
    - name: Build the Windows browser helper
      # On Windows the browser broker and service keep their state through the
      # native ACL helper (electron/browser-extension-windows.mjs) and fail
      # closed without it. package:win builds it the same way, with the
      # runner's own MSVC, into dist-native/browser-extension/win32-x64.
      if: runner.os == 'Windows'
      shell: bash
      run: pnpm build:browser-extension-windows
    - name: Alias the second loopback address (macOS)
      # macOS answers only on 127.0.0.1; Linux and Windows answer on all of
      # 127.0.0.0/8. shared/guarded-http.test.ts proves a socket on a
      # different local address than the validated one is refused, which
      # needs 127.0.0.2 to be reachable here too.
      if: runner.os == 'macOS'
      shell: bash
      run: sudo ifconfig lo0 alias 127.0.0.2 up
