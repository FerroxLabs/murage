name: CI

on:
  # Branches created by GITHUB_TOKEN do not emit their own push event, so the
  # release-prep workflow dispatches this one explicitly for the version PR.
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Confirm Windows-only fixture changes; reuse unaffected platform evidence"
        type: boolean
        default: false
      vitest_file:
        description: "Scoped confirmation: existing test files/directories, one per line; other Vitest evidence reused"
        required: false
        type: string
      human_files:
        description: "Ubuntu human-only confirmation: existing src/e2e/*.human.spec.ts files, one per line; prior CI evidence reused"
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ !inputs.human_files }}
    name: ${{ inputs.vitest_file && 'Scoped CI confirmation' || 'typecheck + test' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The harness and pure desktop capabilities stay portable across all
        # supported host platforms. POSIX-only process tests self-skip.
        os: ${{ fromJSON(inputs.windows_only && '["windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Ubuntu also runs the complete desktop/mobile human suite after runtime
    # checks; the recorded 16-minute prelude left too little of the old 20m cap.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 30 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate scoped CI confirmation input
        shell: bash
        env:
          VITEST_FILE: ${{ inputs.vitest_file }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { lstatSync, realpathSync } from 'node:fs';
          import { isAbsolute, relative, sep } from 'node:path';
          const selection = process.env.VITEST_FILE ?? '';
          if (selection) {
            assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch', 'scoped tests require manual dispatch');
            const paths = selection.split('\n');
            assert.ok(paths.length <= 16, 'at most sixteen scoped paths are allowed');
            for (const file of paths) {
              const testFile = /^(server|electron|src|shared|companion|scripts)\/(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+\.test\.(ts|mjs)$/.test(file);
              const testDirectory = /^(server|electron|src|shared|companion|scripts)(?:\/[A-Za-z0-9_-]+)+$/.test(file);
              assert.ok(testFile || testDirectory, 'vitest_file must contain repository-relative test files or directories');
              const stat = lstatSync(file);
              assert.ok((testFile && stat.isFile()) || (testDirectory && stat.isDirectory()), 'scoped path must be an existing test file or directory');
              const inside = relative(realpathSync('.'), realpathSync(file));
              assert.ok(inside && !isAbsolute(inside) && inside !== '..' && !inside.startsWith(`..${sep}`), 'vitest_file escapes the checkout');
            }
            console.log(`Scoped CI confirmation: ${paths.join(', ')}; unaffected Vitest results are reused, not rerun.`);
          }
          EOF
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the pinned local memory test model
        # P06 executes real offline inference; a clean runner must prepare the
        # hash-pinned fixture before tests, not skip it or fetch during inference.
        run: node --experimental-strip-types scripts/qualify-memory-runtime.ts --prepare-model --allow-download --destination "${{ github.workspace }}/.planning/memory-evidence/model"
      - name: Validate locale catalogs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm i18n:check
      - name: Prepare Electron test runtime
        # Electron 43 lazily downloads its runtime on first import. Resolve it
        # before Vitest starts so a cold download cannot consume the fixture
        # timeout.
        run: node --input-type=commonjs -e "require('electron')"
      - run: pnpm typecheck
      - name: Typecheck the Composio broker Worker
        # `pnpm test` runs the Worker's Vitest suite, but the suite does not
        # compile the Worker: wrangler types + tsc catch a binding or
        # Env-shape regression the tests never touch. Same job, same Node.
        run: pnpm broker:check
      - name: Run tests
        if: inputs.vitest_file == ''
        run: pnpm test
        env:
          # Electron 43 currently exits with EXCEPTION_BREAKPOINT before ready
          # on GitHub's Windows runners even after Chromium's required sandbox
          # ACL is present. Production fails closed there through the tested
          # browser-platform gate; keep probing the upstream regression below.
          MURAGE_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
      - name: Scoped Vitest confirmation and required downstream suites
        if: inputs.vitest_file != ''
        shell: bash
        env:
          VITEST_FILE: ${{ inputs.vitest_file }}
          MURAGE_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
        run: |
          echo "Scoped Vitest confirmation only: $VITEST_FILE"
          test_paths=(); while IFS= read -r test_path; do test_paths+=("$test_path"); done <<< "$VITEST_FILE"
          pnpm check:contrast
          pnpm exec vitest run "${test_paths[@]}"
          pnpm broker:check
          pnpm broker:test
          pnpm test:electron
          pnpm test:packaged-server
      - name: Probe upstream Electron Windows sandbox regression
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          # Keep the canary honest: no --no-sandbox or sandbox-disabling flags.
          # When electron/electron#51761 is resolved, make this blocking first,
          # then remove the production Windows gate in browser-platform.cjs.
          MURAGE_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: "0"
        run: pnpm exec vitest run electron/browser-closed-shadow.electron.test.mjs
      - run: pnpm check:electron
      - name: Verify app permissions and guarded display capture
        # Disposable profile, fake microphone, captures only its own page.
        if: matrix.os == 'macos-latest'
        run: node scripts/smoke-app-permissions.mjs
      - name: Install the Playwright browser
        # One host runs the human specs: they drive the real harness and a
        # real Vite dev server, and the pass they stand in for is a person at
        # one desk — three copies of it would buy nothing but runner minutes.
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run human specs
        if: matrix.os == 'ubuntu-latest'
        env:
          # The rig's data dir and its evidence (playwright.config.ts routes
          # outputDir to <MURAGE_E2E_DATA_DIR>/human-results through
          # src/e2e/evidence.ts, which refuses to run without it): never
          # test-results/ inside the checkout. Required, no default: the rig
          # wipes this directory, and the name carries the "scratch" segment
          # safe-wipe admits (data-safety.md).
          MURAGE_E2E_DATA_DIR: ${{ runner.temp }}/murage-e2e-scratch
        run: pnpm test:human
      - name: Upload human spec traces on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && matrix.os == 'ubuntu-latest'
        with:
          name: murage-human-spec-report
          path: ${{ runner.temp }}/murage-e2e-scratch/human-results
          if-no-files-found: ignore
          retention-days: 7
      - name: production UI build
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec vite build

  human-confirmation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.human_files != '' }}
    name: Scoped Ubuntu human confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Validate selected human specs
        shell: bash
        env:
          HUMAN_FILES: ${{ inputs.human_files }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { lstatSync, realpathSync } from 'node:fs';
          import { isAbsolute, relative, sep } from 'node:path';
          assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch');
          const files = (process.env.HUMAN_FILES ?? '').split('\n');
          assert.ok(files.length >= 1 && files.length <= 16, 'select one to sixteen human specs');
          assert.equal(new Set(files).size, files.length, 'duplicate human specs are not allowed');
          const checkout = realpathSync('.');
          for (const file of files) {
            assert.match(file, /^src\/e2e\/[A-Za-z0-9_.-]+\.human\.spec\.ts$/, 'select repository-relative human spec files');
            assert.ok(lstatSync(file).isFile(), 'selected human spec must be an existing regular file');
            const inside = relative(checkout, realpathSync(file));
            assert.ok(inside && !isAbsolute(inside) && inside !== '..' && !inside.startsWith(`..${sep}`), 'human spec escapes the checkout');
          }
          console.log(`Human-only confirmation: ${files.join(', ')}; prior test, control-plane and package results are reused.`);
          EOF
      - run: pnpm install --frozen-lockfile
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: production UI build
        run: pnpm exec vite build
      - name: Confirm selected human specs
        shell: bash
        env:
          HUMAN_FILES: ${{ inputs.human_files }}
          # See "Run human specs": evidence lands outside the checkout, in a
          # scratch-marked directory safe-wipe admits.
          MURAGE_E2E_DATA_DIR: ${{ runner.temp }}/murage-e2e-scratch
        run: |
          human_paths=()
          while IFS= read -r human_path; do human_paths+=("$human_path"); done <<< "$HUMAN_FILES"
          pnpm exec playwright test "${human_paths[@]}" --retries=0 --trace=on
      - name: Upload human screenshots and traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: murage-scoped-human-confirmation
          path: ${{ runner.temp }}/murage-e2e-scratch/human-results
          if-no-files-found: warn
          retention-days: 7

  control-plane:
    if: ${{ !inputs.windows_only && !inputs.human_files }}
    name: control-plane check + workerd tests + dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm control-plane:check
      - run: pnpm control-plane:test
      - run: pnpm control-plane:dry-run

  package-linux:
    if: ${{ !inputs.windows_only && !inputs.human_files }}
    name: package + smoke (Ubuntu 24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Launch packaged app and verify lifecycle
        env:
          MURAGE_KEEP_SMOKE_DIR: "1"
          MURAGE_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge murage || true
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: murage-ubuntu-smoke-diagnostics
          path: |
            /tmp/murage-linux-smoke-*
            /tmp/murage-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
