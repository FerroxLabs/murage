name: Native addon MSVC compile

# Compile-only check of native/engine-exclusion with the real MSVC toolchain and Windows SDK (the same scripts/build-engine-exclusion.mjs
# the Windows package uses). mingw accepts header mixes (<winternl.h> with <ntsecapi.h>) that MSVC rejects with C2371, so this runs on
# every PR and push that touches native/ or the build script, ahead of the 90-minute Package Windows run. No packaging, no signing. It also refuses a build that imports anything but system DLLs
# (a /MD build imported VCRUNTIME140.dll and failed to load on a clean Windows machine) and uploads the built files.
# The x64 job builds win32-x64 and cross-compiles win32-arm64 (--all-arch); the arm64 job builds and tests the addon natively on a
# windows-11-arm runner. Both also build the test-hooks variant (dist-native/engine-exclusion-test, never packaged) and run the
# anchored-open helper's direct tests (CONTRACTS-B 1.3, R1-R22) against it.
# A dispatch that sets vitest_files also runs the "suites" job: those Vitest files on windows-latest with the real addon (see the job).
on:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/build-engine-exclusion.mjs'
      - 'scripts/build-presence-guard.mjs'
      - 'scripts/build-anchored-read.mjs'
      - 'scripts/anchored-read-resource.mjs'
      - 'scripts/prove-anchored-read.mjs'
      - 'scripts/presence-guard-evidence.mjs'
      - 'scripts/qualification/notify/native-provenance.mjs'
      - 'scripts/build-fuigo-probe.mjs'
      - 'scripts/windows-native-imports.mjs'
      - 'electron/windows-native.mjs'
      - 'electron/backup-windows-acl*.mjs'
      - 'electron/backup-remote-*.mjs'
      - 'shared/windows-sddl.mjs'
      - 'server/claude-code-import*.ts'
      - '.github/workflows/native-addon-msvc.yml'
  push:
    paths:
      - 'native/**'
      - 'scripts/build-engine-exclusion.mjs'
      - 'scripts/build-presence-guard.mjs'
      - 'scripts/build-anchored-read.mjs'
      - 'scripts/anchored-read-resource.mjs'
      - 'scripts/prove-anchored-read.mjs'
      - 'scripts/presence-guard-evidence.mjs'
      - 'scripts/qualification/notify/native-provenance.mjs'
      - 'scripts/build-fuigo-probe.mjs'
      - 'scripts/windows-native-imports.mjs'
      - 'electron/windows-native.mjs'
      - 'electron/backup-windows-acl*.mjs'
      - 'electron/backup-remote-*.mjs'
      - 'shared/windows-sddl.mjs'
      - 'server/claude-code-import*.ts'
      - '.github/workflows/native-addon-msvc.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact qualification source commit (blank uses the dispatch commit)
        required: false
        type: string
      vitest_files:
        description: Also run these repository-relative Vitest files (one per line) on windows-latest with the real addon built there (blank runs none)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: native-addon-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: engine-exclusion addon (cl.exe, x64 and arm64 cross)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Admit exact qualification source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Node headers for the engine-exclusion addon
        shell: bash
        run: |
          v=$(node -p process.version)
          dir="$(cygpath -u "$RUNNER_TEMP")/node-headers"; mkdir -p "$dir"
          curl -fsSL "https://nodejs.org/dist/$v/node-$v-headers.tar.gz" -o "$dir/h.tgz"
          curl -fsSL "https://nodejs.org/dist/$v/SHASUMS256.txt" -o "$dir/sums"
          (cd "$dir" && want=$(grep " node-$v-headers.tar.gz\$" sums | cut -d' ' -f1) && echo "$want  h.tgz" | sha256sum -c - && tar xzf h.tgz)
          echo "NODE_HEADERS_DIR=$(cygpath -w "$dir/node-$v/include/node")" >> "$GITHUB_ENV"
      - name: Compile the addon with MSVC (x64, and arm64 by cross-compile)
        shell: bash
        run: node scripts/build-engine-exclusion.mjs --all-arch
      - name: Compile the test-hooks addon and the oplock fixture (never packaged)
        shell: bash
        run: node scripts/build-engine-exclusion.mjs --test-hooks
      - name: Build the Fuigo launcher with MSVC
        shell: bash
        run: node scripts/build-fuigo-probe.mjs
      - name: Compile the presence guard addon with MSVC
        shell: bash
        run: |
          node --test scripts/build-presence-guard.node-test.mjs electron/presence-guard-native-contract.node-test.mjs
          node scripts/build-presence-guard.mjs
          node scripts/windows-native-imports.mjs dist-native/presence-guard/win32-x64/presence-guard.node
      - name: Compile and prove the anchored reader with MSVC
        shell: bash
        run: |
          node scripts/build-anchored-read.mjs
          node scripts/windows-native-imports.mjs dist-native/anchored-read/win32-x64/anchored-read.node
          node scripts/prove-anchored-read.mjs dist-native/anchored-read/win32-x64/anchored-read.node
      - name: EVIDENCE - presence guard load, read, subscribe and unsubscribe in plain Node
        shell: bash
        run: node scripts/presence-guard-evidence.mjs dist-native/presence-guard/win32-x64/presence-guard.node dist-native/presence-guard/win32-x64/presence-evidence.json
      - name: Refuse any import beyond Windows system DLLs
        shell: bash
        run: node scripts/windows-native-imports.mjs dist-native/engine-exclusion/win32-x64/engine-exclusion.node dist-native/engine-exclusion/win32-arm64/engine-exclusion.node dist-native/engine-exclusion-test/win32-x64/engine-exclusion.node dist-native/engine-exclusion-test/win32-x64/oplock-holder.exe dist-native/engine-exclusion-test/win32-x64/reparse-convert.exe dist-native/fuigo-probe/win32-x64/launcher.exe
      - name: ReFS volume on a virtual disk (the helper's local-storage rule must pass on ReFS too, R16)
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'refs.vhdx'
          $script = "create vdisk file=`"$vhd`" maximum=2048 type=expandable`nattach vdisk`ncreate partition primary`nformat fs=refs quick label=ANCHORREFS`nassign letter=R`n"
          $file = Join-Path $env:RUNNER_TEMP 'refs.diskpart'
          Set-Content -Path $file -Value $script -Encoding ascii
          diskpart /s $file
          if (-not (Test-Path 'R:\')) { throw 'ReFS volume was not created' }
          "ANCHOR_REFS_ROOT=R:\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Anchored-open helper direct tests (real Windows, x64, with the test-hooks build)
        shell: bash
        env:
          CI: "1"
          # the ReFS setup step above must succeed (no continue-on-error); with this set the ReFS case FAILS, never skips, if the volume is missing
          ANCHOR_REFS_EXPECTED: "1"
        run: node --expose-gc --test native/engine-exclusion/anchored-win.node-test.mjs native/engine-exclusion/anchored-win-settle.node-test.mjs
      - name: Real-Windows owner-only ACL tests on the built addon
        # The quality-gates job builds no addon, so these skip there (a source checkout without it refuses, by design). Here the
        # addon is the one just built: the runner's built-in Administrator is SDDL "LA", which only the addon's domainSids resolves,
        # and owners are read only through fileOwnerSid. MURAGE_REQUIRE_WINDOWS_NATIVE=1 fails, never skips, without the addon.
        shell: bash
        env:
          MURAGE_REQUIRE_WINDOWS_NATIVE: "1"
        run: node --import ./server/testing/safe-wipe-preload.mjs --test electron/backup-windows-acl.node-test.mjs electron/backup-windows-acl-native.node-test.mjs electron/backup-remote-windows-spelling.node-test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-addon-msvc
          path: |
            dist-native/engine-exclusion/win32-x64/engine-exclusion.node
            dist-native/engine-exclusion/win32-arm64/engine-exclusion.node
            dist-native/fuigo-probe/win32-x64/launcher.exe
            dist-native/presence-guard/win32-x64/presence-guard.node
            dist-native/anchored-read/win32-x64/anchored-read.node
            dist-native/anchored-read/win32-x64/build.json
            dist-native/presence-guard/win32-x64/build.json
            dist-native/presence-guard/win32-x64/presence-evidence.json
          retention-days: 3

  arm64:
    name: engine-exclusion addon (cl.exe, native arm64)
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Node headers for the engine-exclusion addon
        shell: bash
        run: |
          v=$(node -p process.version)
          dir="$(cygpath -u "$RUNNER_TEMP")/node-headers"; mkdir -p "$dir"
          curl -fsSL "https://nodejs.org/dist/$v/node-$v-headers.tar.gz" -o "$dir/h.tgz"
          curl -fsSL "https://nodejs.org/dist/$v/SHASUMS256.txt" -o "$dir/sums"
          (cd "$dir" && want=$(grep " node-$v-headers.tar.gz\$" sums | cut -d' ' -f1) && echo "$want  h.tgz" | sha256sum -c - && tar xzf h.tgz)
          echo "NODE_HEADERS_DIR=$(cygpath -w "$dir/node-$v/include/node")" >> "$GITHUB_ENV"
      - name: Which Node is this
        shell: bash
        run: node -p "process.arch + ' ' + process.version"
      - name: Compile the addon with MSVC (host architecture)
        shell: bash
        run: node scripts/build-engine-exclusion.mjs
      - name: Compile the test-hooks addon and the oplock fixture (never packaged)
        shell: bash
        run: node scripts/build-engine-exclusion.mjs --test-hooks
      - name: Refuse any import beyond Windows system DLLs
        shell: bash
        run: node scripts/windows-native-imports.mjs dist-native/engine-exclusion/win32-arm64/engine-exclusion.node dist-native/engine-exclusion-test/win32-arm64/engine-exclusion.node dist-native/engine-exclusion-test/win32-arm64/oplock-holder.exe dist-native/engine-exclusion-test/win32-arm64/reparse-convert.exe
      - name: Anchored-open helper direct tests (real Windows, arm64, with the test-hooks build)
        shell: bash
        env:
          CI: "1"
        run: node --expose-gc --test native/engine-exclusion/anchored-win.node-test.mjs native/engine-exclusion/anchored-win-settle.node-test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-addon-msvc-arm64
          path: dist-native/engine-exclusion/win32-arm64/engine-exclusion.node
          retention-days: 3

  suites:
    name: Vitest with the real addon (windows-latest)
    # Dispatch only, when vitest_files is set. On Windows every engine launch is refused (EPOWER, "could not block shut down and
    # restart") unless the engine-exclusion addon removed the shutdown privileges from the server's token (server/procs.ts
    # dropServerShutdownPrivileges), so a machine with no MSVC and no built addon cannot run the ACP judge suites at all. This job
    # builds the addon with the runner's MSVC through the same vitest-runtime action the CI shards use, proves it loads at the
    # version the checkout's server asks for and that its privilege removal answers ok, then runs each named file with its own
    # JSON report and uploads the reports and the addon receipt.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vitest_files != '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/windows-ci-tools
        if: runner.os == 'Windows'
      - name: Admit exact source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "source $EXPECTED_SHA"
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the engine-exclusion addon with the runner's MSVC (plus the test-hooks build and the Windows browser helper).
      - uses: ./.github/actions/vitest-runtime
      - name: Keep the Windows test folders on the runner's work disk
        shell: bash
        run: |
          dir="$RUNNER_TEMP/murage-test-tmp"; mkdir -p "$dir"; win=$(cygpath -w "$dir")
          { echo "TEMP=$win"; echo "TMP=$win"; } >> "$GITHUB_ENV"
      - name: Provision required Windows command fixtures
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 is required' }
          $fixtureVersion = '7.4.13'
          $fixturePowerShell = Join-Path $env:RUNNER_TEMP "pwsh-$fixtureVersion"
          $actual = & "$fixturePowerShell/pwsh.exe" -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0 -or $actual -ne $fixtureVersion) { throw 'Required pwsh version did not answer' }
          $fixtureBash = Join-Path $env:ProgramFiles 'Git/bin'
          & "$fixtureBash/bash.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash is required' }
          $fixturePowerShell | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fixtureBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prove the real addon loads at the server's version and removes the shutdown privileges
        # The same file the server loads from a source checkout (server/engine-exclusion.ts candidates(): dist-native/engine-exclusion/
        # win32-<arch>), not the test override. The removal is run in this throwaway node process only; the test processes run their own.
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/win-addon-suite"; mkdir -p "$out"
          cp "dist-native/engine-exclusion/win32-$(node -p process.arch)/build.json" "$out/engine-exclusion-build.json"
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const want = Number(/export const ADDON_VERSION = (\d+);/.exec(fs.readFileSync("server/engine-exclusion.ts", "utf8"))?.[1]);
            const a = require(process.cwd() + "/dist-native/engine-exclusion/win32-" + process.arch + "/engine-exclusion.node");
            const hooks = Object.keys(a).filter((n) => n.startsWith("anchorTest"));
            const drop = typeof a.dropShutdownPrivileges === "function" ? a.dropShutdownPrivileges() : null;
            const answer = { version: a.version(), want, hooks: hooks.length, drop };
            console.log(JSON.stringify(answer));
            fs.writeFileSync(process.argv[1], JSON.stringify(answer, null, 2));
            if (!Number.isInteger(want) || answer.version !== want || hooks.length !== 0 || drop?.ok !== true) process.exit(1);
          ' "$out/addon-check.json"
      - name: Run the named suites with the real addon
        shell: bash
        env:
          MURAGE_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: "1"
          VITEST_FILES: ${{ inputs.vitest_files }}
        run: |
          # GitHub's bash shell starts with -e: switch it off so every named file runs and its exit is recorded in exits.txt
          set +e -uo pipefail
          out="$RUNNER_TEMP/win-addon-suite"; mkdir -p "$out"
          # the PATH's shape, counts only (outside-wire lookupProgramFor fails closed past 64 folders or on a relative entry)
          node -e 'const p = process.env.PATH.split(require("node:path").delimiter); console.log(JSON.stringify({ folders: p.length, empty: p.filter((f) => f === "").length, relative: p.filter((f) => f !== "" && !require("node:path").isAbsolute(f)).length }))' | tee "$out/path-shape.json"
          files=(); while IFS= read -r f; do
            f="${f%$'\r'}"; f="${f#"${f%%[![:space:]]*}"}"; f="${f%"${f##*[![:space:]]}"}"
            [ -z "$f" ] && continue
            [[ "$f" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*\.test\.(ts|mts|mjs|tsx)$ && "$f" != *..* ]] || { echo "::error::not a repository-relative test file: $f"; exit 1; }
            test -f "$f" || { echo "::error::no such test file: $f"; exit 1; }
            files+=("$f")
          done <<< "$VITEST_FILES"
          test "${#files[@]}" -gt 0 || { echo "::error::no test files named"; exit 1; }
          failed=0
          for f in "${files[@]}"; do
            name=$(basename "$f" | sed 's/[^A-Za-z0-9_.-]/_/g')
            echo "== $f"
            node node_modules/vitest/vitest.mjs run "$f" --reporter=default --reporter=json --outputFile.json="$out/report-$name.json" 2>&1 | tee "$out/log-$name.txt"
            code=${PIPESTATUS[0]}
            echo "$f exit $code" | tee -a "$out/exits.txt"
            [ "$code" -eq 0 ] || failed=1
          done
          exit $failed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: win-addon-suite-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/win-addon-suite
          if-no-files-found: warn
          retention-days: 7
