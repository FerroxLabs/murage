name: Recovery snapshot qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/0150-recovery-snapshot]
    paths:
      - native/recovery-snapshot/**
      - scripts/qualify-recovery-snapshot.ts
      - .github/workflows/recovery-snapshot-qualification.yml
permissions:
  contents: read
jobs:
  native-capture:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile only the disposable native capture fixture
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /EHsc /W4 /D_WIN32_WINNT=0x0602 native\recovery-snapshot\capture.cpp native\recovery-snapshot\fixture.cpp /Fe:native\recovery-snapshot\fixture.exe /link VssApi.lib Ole32.lib OleAut32.lib Advapi32.lib Uuid.lib
          if errorlevel 1 exit /b %errorlevel%
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Real VSS on unique disposable fixtures only
        run: node --experimental-strip-types scripts/qualify-recovery-snapshot.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-snapshot-receipts
          path: .planning/0150-recovery-native
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
