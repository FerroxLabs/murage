# Contributor License Agreement check. Every pull request author must accept
# CLA.md once, by commenting the sentence the bot asks for. Signatures are
# stored in signatures/cla.json on the `cla-signatures` branch, so main stays
# clean. Maintainers and bots are allowlisted.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/FerroxLabs/murage/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'FerroxLabs,dependabot[bot],github-actions[bot],renovate[bot]'
          custom-notsigned-prcomment: 'Thanks for your pull request. Before we can merge it, please read our [Contributor License Agreement](https://github.com/FerroxLabs/murage/blob/main/CLA.md) and sign it by commenting the sentence below. You only need to do this once for all future contributions.'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
