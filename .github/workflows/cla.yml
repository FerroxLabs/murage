# Contributor License Agreement check. A pull request cannot merge until its
# author has signed CLA.md. Signatures are stored on the `cla-signatures`
# branch in signatures/cla.json, which is why contents: write is needed; the
# other three permissions are the ones the action documents for re-running the
# check and setting the status after someone signs.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs with a write token. This job never checks out or
# runs code from the pull request: it only reads CLA.md from the base branch.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # 2026-10-25: Linux runners are pinned to ubuntu-24.04. ubuntu-latest moved to 26.04, which stays pinned out until
  # Playwright supports chromium there and the electron no-desktop-session backup test passes on it (1.0.7 follow-up).
  cla:
    runs-on: ubuntu-24.04
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/FerroxLabs/murage/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
