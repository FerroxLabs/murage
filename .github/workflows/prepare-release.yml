# Opens or reuses the version-bump PR and retains its reviewable patch.
name: Prepare next release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - custom
      version:
        description: "Custom version (only used when Version bump is custom)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the version-bump patch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.next }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Release check - require the reviewed Signal pin and all five post-G0 gates
        env:
          RELEASE: '1'
        run: node scripts/signal-release-check.mjs

      # A release cannot build without the Murage for Chrome store identity
      # (release.yml checks it again). Refuse before the version bump lands on
      # main, not after, so main is never left unreleasable.
      - name: Murage for Chrome release identity is set
        run: node scripts/release-guard.mjs browser-extension extensions/murage-browser/release.json > /dev/null

      - name: Choose the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.version }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          current=$(node scripts/release-guard.mjs version)
          next=$(node scripts/release-guard.mjs next-version "$current" "$BUMP" "$CUSTOM_VERSION")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      # Release API access belongs only to assemble. Keep a reviewable patch too.
      - name: Prepare the version bump for review
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          npm pkg set "version=$VERSION"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          git diff --check
          git diff --binary -- package.json > release-version.patch
          echo "The open-pr job opens or reuses the version-bump PR and dispatches CI. This patch is retained for review." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-version-patch
          path: release-version.patch
          if-no-files-found: error

  open-pr:
    name: Open or reuse the release preparation PR
    needs: [prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/release-preparation.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
