name: Mac notification authorization compile preflight
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact qualification source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mac-notification-authorization-preflight
  cancel-in-progress: false
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Admit exact source and compile both Mac architectures
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -m)" = arm64
          test "$(id -un)" = runner
          test "$(node --version)" = v24.20.0
          mkdir -m 700 "$RUNNER_TEMP/notification-auth-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/notification-auth-evidence/source-sha.txt"
          node scripts/build-notification-authorization.mjs
          cp dist-native/notification-authorization/arm64/build.json "$RUNNER_TEMP/notification-auth-evidence/arm64-build.json"
          cp dist-native/notification-authorization/x64/build.json "$RUNNER_TEMP/notification-auth-evidence/x64-build.json"
          lipo dist-native/notification-authorization/arm64/notification-authorization.node -verify_arch arm64
          lipo dist-native/notification-authorization/x64/notification-authorization.node -verify_arch x86_64
      - name: Load notification addon and record all six exports
        shell: bash
        run: |
          node --input-type=commonjs - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          assert.equal(process.platform, 'darwin');
          assert.equal(process.arch, 'arm64');
          const binding = require('./dist-native/notification-authorization/arm64/notification-authorization.node');
          const expected = ['status', 'request', 'registerCategories', 'post', 'remove', 'onResponse'];
          const exports = Object.getOwnPropertyNames(binding).sort();
          for (const name of expected) assert.equal(typeof binding[name], 'function', name);
          assert.deepEqual(exports, [...expected].sort());
          const build = JSON.parse(fs.readFileSync('./dist-native/notification-authorization/arm64/build.json', 'utf8'));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/notification-auth-evidence/export-load.json', JSON.stringify({
            loaded: true, node: process.version, arch: process.arch, exports,
            sourceSha256: build.sourceSha256, sha256: build.sha256,
            statusExport: true, requestExport: true,
            addonMethodsCalled: false, authorizationMethodsCalled: false, osPermissionRequested: false
          }, null, 2) + '\n');
          NODE
      - name: Verify notification banner and presence guard build and source contracts
        run: node --test scripts/build-notification-authorization.node-test.mjs electron/notification-banners-native-contract.node-test.mjs scripts/build-presence-guard.node-test.mjs electron/presence-guard-native-contract.node-test.mjs
      - name: Compile and verify both presence guard architectures
        run: |
          set -euo pipefail
          node scripts/build-presence-guard.mjs
          lipo dist-native/presence-guard/darwin-arm64/presence-guard.node -verify_arch arm64
          lipo dist-native/presence-guard/darwin-x64/presence-guard.node -verify_arch x86_64
      - name: EVIDENCE - load arm64 presence guard in plain Node
        run: |
          set -euo pipefail
          test "$(node -p process.arch)" = arm64
          node scripts/presence-guard-evidence.mjs dist-native/presence-guard/darwin-arm64/presence-guard.node dist-native/presence-guard/darwin-arm64/presence-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mac-notification-auth-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/notification-auth-evidence/
            dist-native/notification-authorization/*/notification-authorization.node
            dist-native/presence-guard/darwin-arm64/presence-guard.node
            dist-native/presence-guard/darwin-arm64/build.json
            dist-native/presence-guard/darwin-arm64/presence-evidence.json
            dist-native/presence-guard/darwin-x64/presence-guard.node
            dist-native/presence-guard/darwin-x64/build.json
          if-no-files-found: warn
          retention-days: 7
