# Windows installer, built on a real Windows runner and published as a
# workflow artifact.
#
# Why this exists: releases are cut by hand from a Mac, which cannot build
# an NSIS installer (electron-builder needs wine, and a cross-built exe
# that never ran on Windows is exactly the artifact that looks fine and
# breaks in the field). So every release so far shipped Windows behind the
# mac build — different trees under one version number. Run this from the
# same commit as the mac build and attach the artifact to the release.
#
# Deliberately artifact-only: pushing straight to the separate releases
# repo would need a cross-repo token this workflow has no business holding.
name: Package Windows

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

jobs:
  package:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the packaged app ships compiled JS, so a stale dist/ or dist-server/
      # would ride along unsigned-for and unsealed (the 0.1.15 "damaged"
      # incident) — a fresh checkout is clean, but be explicit
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - name: Pinned native Python for GEPA
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
      - name: Build unsigned pinned GEPA worker
        shell: pwsh
        run: |
          python -I native/gepa/build-windows.py "$env:RUNNER_TEMP/gepa-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign GEPA native images before freezing their manifest
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: ferrox-labs-signing
          certificate-profile-name: ferroxlabs
          files-folder: ${{ github.workspace }}/dist-native/gepa/win32-x64
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-digest: SHA256
          exclude-azure-cli-credential: true
          timeout: 300
      - name: Verify signed GEPA runtime and freeze trusted metadata
        shell: pwsh
        run: |
          ./native/gepa/verify-windows.ps1 -Bundle "$pwd/dist-native/gepa/win32-x64" -Receipt "$pwd/qualification-evidence/gepa-windows-signatures.json"
          & "$env:RUNNER_TEMP/gepa-windows/venv/Scripts/python.exe" -I native/gepa/offline-fixture.py -- "$pwd/dist-native/gepa/win32-x64/gepa-worker.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node native/gepa/create-manifest.mjs "$pwd/dist-native/gepa/win32-x64" win32-x64 "$pwd/qualification-evidence/gepa-package-metadata.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package (Azure Trusted Signing)
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw -LiteralPath qualification-evidence/gepa-package-metadata.json | ConvertFrom-Json
          $hash = $metadata.extraMetadata.murageGepaManifests.'win32-x64'
          if ($hash -notmatch '^[a-f0-9]{64}$') { throw 'Missing trusted GEPA manifest hash' }
          pnpm package:win "--config.extraMetadata.murageGepaManifests.win32-x64=$hash"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      - name: Record installer identity and verify publisher
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter 'Murage-*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one versioned Murage installer' }
          $installer = $installers[0]
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'Installer signature is invalid or untimestamped' }
          $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -ne 'Ferrox Labs, LLC') { throw 'Unexpected installer publisher' }
          @{ sourceSha = (git rev-parse HEAD); file = $installer.Name; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant(); publisher = $publisher } | ConvertTo-Json | Set-Content -LiteralPath qualification-evidence/windows-installer.json -Encoding utf8
      # Three things silently produce an installer that builds fine and is
      # broken in the field, and none of them can be checked from the Mac the
      # release is cut on — the artifact carries only the .exe. So assert them
      # here, where the unpacked tree exists, and fail the build instead of
      # shipping it.
      - name: verify the packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          fail=0
          # missing → utilityProcess.fork fails → the 🔥 "Couldn't start the
          # bot server" page
          [ -f "$res/server/index.js" ] || { echo "::error::missing $res/server/index.js"; fail=1; }
          # missing → the server has nothing to serve → black window
          [ -f "$res/ui/index.html" ] || { echo "::error::missing $res/ui/index.html"; fail=1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || {
            echo "::error::missing $res/cloudflared/cloudflared.exe"; fail=1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || {
            echo "::error::missing cloudflared Apache 2.0 license"; fail=1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || {
            echo "::error::missing cloudflared release provenance"; fail=1; }
          if [ -f "$res/cloudflared/cloudflared.exe" ]; then
            expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
            actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || {
              echo "::error::packaged cloudflared hash is $actual"; fail=1; }
            "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
              echo "::error::packaged cloudflared has the wrong version"; fail=1; }
          fi
          [ -f "$res/app-update.yml" ] || { echo "::error::missing $res/app-update.yml"; fail=1; }
          if [ -f "$res/app-update.yml" ]; then
            # Both halves, anchored: a substring match on the repo alone would
            # pass a feed pointing at some other account's murage-releases.
            grep -Eq '^owner: FerroxLabs$' "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at owner FerroxLabs"; fail=1; }
            grep -Eq '^repo: murage-releases$' "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at repo murage-releases"; fail=1; }
            # the build is signed now, so publisherName is required: without
            # it electron-updater skips verification, and a mismatch rejects
            # every update as untrusted
            grep -q "publisherName" "$res/app-update.yml" || {
              echo "::error::app-update.yml has no publisherName on a signed build"; fail=1; }
            grep -q "Ferrox Labs, LLC" "$res/app-update.yml" || {
              echo "::error::publisherName does not match the signing certificate"; fail=1; }
          fi
          echo "--- app-update.yml ---"; cat "$res/app-update.yml" 2>/dev/null || true
          exit $fail

      # index.js EXISTING is not the same as index.js RUNNING. 0.1.24 shipped a
      # server that died instantly on ERR_MODULE_NOT_FOUND because tsc left a
      # bare `zod` import in a tree that carries no node_modules — and the
      # existence check above passed it. Start the real packaged copy here,
      # where node_modules genuinely is not present.
      - name: start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/murage-smoke" USERPROFILE="$RUNNER_TEMP/murage-smoke" \
            MURAGE_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health ✓"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          kill $pid 2>/dev/null || true
          exit 1

      - name: Retain Windows qualification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-qualification-evidence
          path: qualification-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
