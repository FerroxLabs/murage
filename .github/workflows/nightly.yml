#
# The tests CI's per-push shards leave out, run every night and on demand. Nothing here is skipped:
#   - `nightly`: tests over 60 s on a hosted runner (the 500k-version purge, 100k-row queues, 1M postings and
#     the like). They run on all three OSes, sharded, with the same runtime as ci.yml.
#   - `perf-budget` tests assert a wall-clock budget measured on dedicated hardware. Hosted runners are
#     several times slower and noisier (1.0.2 CI 38854980345: 150 ms budgets measured 153-413 ms on macOS),
#     so they are not run here; the maintainers run them on their own perf hardware.
# The tags live in vite.config.ts. A release needs the newest completed run of this workflow green, on the
# release commit or an ancestor, and under 72 h old (scripts/release-ci-gate.mjs). Before a release, dispatch
# it on the release commit if the last night's run is older or red.
name: Nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 2026-10-25: Linux runners are pinned to ubuntu-24.04. ubuntu-latest moved to 26.04, which stays pinned out until
  # Playwright supports chromium there and the electron no-desktop-session backup test passes on it (1.0.7 follow-up).
  slow:
    name: nightly tests ${{ matrix.shard }}/3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    # Tagged tests and whole-file scale tests have separate time budgets.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/vitest-runtime
      # Every test makes its home and data folders under os.tmpdir(). On the hosted Windows image that is on C:, where one
      # SQLite commit with synchronous=FULL (the app's setting) measured p50 3.2 ms / p99 7.3 ms, against 0.13 / 0.23 ms on the
      # runner's work disk D: (CI 39355463118); the 100k-row tests ran 10-20x their macOS time on C: and timed out. The tests
      # still flush every commit; they only do it on the disk the runner gives jobs to work on (macOS and Linux measured the
      # same on either location, 0.2 ms).
      - name: Keep the Windows test folders on the runner's work disk
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/murage-test-tmp"; mkdir -p "$dir"; win=$(cygpath -w "$dir")
          { echo "TEMP=$win"; echo "TMP=$win"; } >> "$GITHUB_ENV"
      - name: Run the nightly tests
        shell: bash
        run: pnpm exec vitest run --config vitest.nightly.config.ts --shard=${{ matrix.shard }}/3 --tags-filter=nightly
        env:
          # handoff-dispatch.structure.test.ts builds the whole server's TypeScript program six times in one worker. On the 7 GB
          # macOS runner that outgrew Node's default heap and killed the worker ("Worker exited unexpectedly", 1.0.3 nightly
          # 39372113002); ci.yml's typecheck needs the same setting for the same project (tsc exit 134). Forks inherit it.
          NODE_OPTIONS: --max-old-space-size=6144
          MURAGE_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: ${{ matrix.os == 'windows-latest' && '1' || '0' }}

  nightly-scale:
    name: nightly-scale (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/vitest-runtime
      - name: Keep the Windows test folders on the runner's work disk
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/murage-test-tmp"; mkdir -p "$dir"; win=$(cygpath -w "$dir")
          { echo "TEMP=$win"; echo "TMP=$win"; } >> "$GITHUB_ENV"
      - name: Run the whole-file scale tests
        # These files are assigned to nightly as whole files in ci/extended-tests.txt.
        shell: bash
        run: |
          node scripts/ci-test-tiers.mjs list --tier nightly > "$RUNNER_TEMP/nightly-files.txt"
          args=(); while IFS= read -r arg; do args+=("${arg%$'\r'}"); done < "$RUNNER_TEMP/nightly-files.txt"
          test "${#args[@]}" -gt 0
          node node_modules/vitest/vitest.mjs run "${args[@]}"
        env:
          MURAGE_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: ${{ matrix.os == 'windows-latest' && '1' || '0' }}

  cloud-portal:
    name: cloud portal journeys (fake control plane)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JOURNEY_CP: fake
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: cloud-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud-portal/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # playwright.config.ts owns all three local servers, including fake-cp.ts;
      # reuseExistingServer is false, so no live control plane can be reused.
      - run: npm run test:e2e
      - name: Retain portal failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-portal-results
          path: cloud-portal/test-results
          if-no-files-found: warn
          retention-days: 7

  nightly:
    # One result for the release gate and for branch rules: success only if every job passed.
    if: ${{ always() }}
    needs: [slow, nightly-scale, cloud-portal, real-engine-package, real-engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          SLOW: ${{ needs.slow.result }}
          SCALE: ${{ needs.nightly-scale.result }}
          CLOUD_PORTAL: ${{ needs.cloud-portal.result }}
          REAL_ENGINE_PACKAGE: ${{ needs.real-engine-package.result }}
          REAL_ENGINE: ${{ needs.real-engine.result }}
        run: |
          echo "nightly tests: $SLOW"
          echo "real-engine package: $REAL_ENGINE_PACKAGE; real-engine matrix: $REAL_ENGINE"
          test "$SLOW" = success
          test "$SCALE" = success
          test "$CLOUD_PORTAL" = success
          test "$REAL_ENGINE_PACKAGE" = success
          test "$REAL_ENGINE" = success

  real-engine-package:
    name: package for real engines (RC SHA)
    # MAIN RULING 1115-REAL-ENGINE-RUNNER: runs only where the repo variable opts in; skipped (never queued) otherwise.
    if: ${{ vars.MURAGE_REAL_ENGINE_RUNNER == 'on' }}
    runs-on: [self-hosted, Linux, X64, real-engine]
    timeout-minutes: 120
    # Pre-provisioned Node 24/native packaging toolchain. No host installs or logins.
    container:
      image: ${{ vars.MURAGE_REAL_ENGINE_IMAGE || 'node:24-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build the exact RC package
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4300
        run: |
          while awk '{exit !($1 > 60)}' /proc/loadavg; do sleep 60; done
          python3 -I native/gepa/build-linux.py "$RUNNER_TEMP/gepa-linux"
          gepa_hash="$(node -e 'const m=require("./qualification-evidence/gepa-package-metadata.json"); const h=m.extraMetadata.murageGepaManifests["linux-x64"]; if(!/^[a-f0-9]{64}$/.test(h))process.exit(1); process.stdout.write(h)')"
          pnpm package:linux:dir "--config.extraMetadata.murageGepaManifests.linux-x64=$gepa_hash" "--config.extraMetadata.murageSourceSha=$SOURCE_SHA"
          tar -czf "$RUNNER_TEMP/real-engine-package.tgz" -C release linux-unpacked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-engine-package-${{ github.sha }}
          path: ${{ runner.temp }}/real-engine-package.tgz
          if-no-files-found: error
          retention-days: 7

  real-engine:
    name: real-engine (${{ matrix.engine }})
    # Run preflight even if packaging failed: absent engines must say NOT-RUN.
    if: ${{ always() && !cancelled() && vars.MURAGE_REAL_ENGINE_RUNNER == 'on' }}
    needs: [real-engine-package]
    runs-on: [self-hosted, Linux, X64, real-engine]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [claude, codex, gemini, fuigo, opencode]
    container:
      image: ${{ vars.MURAGE_REAL_ENGINE_IMAGE || 'node:24-bookworm' }}
      volumes:
        - ${{ vars.MURAGE_REAL_ENGINE_HOME || '/opt/murage-gate/home' }}:/engine-home:ro
        - ${{ vars.MURAGE_REAL_ENGINE_BIN || '/opt/murage-gate/bin' }}:/engines:ro
    env:
      HOME: /engine-home
      SMOOTH_OUT: /tmp/smooth-evidence
      # Only existing secrets are used; missing entries remain empty and fail preflight.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      FUIGO_API_KEY: ${{ secrets.FUIGO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Existing engine prerequisites
        shell: bash
        run: |
          export PATH="/engines:$PATH"
          node scripts/smoothness/real-engine.mjs '${{ matrix.engine }}' --preflight
      - name: Require the RC package
        if: ${{ success() && needs.real-engine-package.result != 'success' }}
        shell: bash
        run: |
          export PATH="/engines:$PATH"
          node scripts/smoothness/real-engine.mjs '${{ matrix.engine }}' --package-unavailable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: real-engine-package-${{ github.sha }}
          path: /tmp/smooth-package
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          dest: /tmp/pnpm-setup
      - run: pnpm install --frozen-lockfile --store-dir /tmp/pnpm-store
      - name: Real-engine verdict
        shell: bash
        run: |
          export PATH="/engines:$PATH"
          while awk '{exit !($1 > 60)}' /proc/loadavg; do sleep 60; done
          tar -xzf /tmp/smooth-package/real-engine-package.tgz -C /tmp/smooth-package
          export SMOOTH_APP_DIR=/tmp/smooth-package/linux-unpacked
          zsh scripts/smoothness/hz-smooth.sh --nightly-real-engine '${{ matrix.engine }}'
      - name: Preserve per-engine verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-engine-verdict-${{ matrix.engine }}-${{ github.sha }}
          path: /tmp/smooth-evidence/real-engine-*.json
          if-no-files-found: warn
          retention-days: 14
