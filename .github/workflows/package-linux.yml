# Ubuntu packages, built and exercised on the exact distribution we support.
#
# This workflow deliberately produces an artifact instead of publishing to the
# separate public releases repository. That keeps cross-repository credentials
# out of the source repository while still making every release candidate
# reproducible from an exact ref. Attach the resulting files to the matching
# murage-releases release after the smoke test passes.
name: Package Ubuntu

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string
      source_run_id:
        description: "Verification only: successful Linux artifact run ID; ref must be its full source SHA"
        required: false
        type: string
      expected_version:
        description: "Verification only: published X.Y.Z version expected from the live updater feed"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    if: inputs.source_run_id == '' && inputs.expected_version == ''
    name: DEB + AppImage (Ubuntu 24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Verify the package-owned install hook
        run: pnpm exec vitest run scripts/linux-after-install.test.mjs
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Prove the handed-over Ubuntu command installs
        # The .deb path ends with a command on the user's clipboard, so the
        # command is the deliverable. Runs it as root on a clean Ubuntu through
        # a real shell, and checks that the `dpkg -i` it replaced still fails
        # there — the reason the app must not run that itself.
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          pnpm smoke:deb-command "${deb[0]}"
      - name: Prove an AppImage update lands on the launched path
        # Mandatory prepublication proof against an isolated candidate feed.
        # After publication, rerun without --candidate-feed for live GitHub proof.
        run: pnpm smoke:linux-update --candidate-feed
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Launch packaged app and verify lifecycle
        env:
          MURAGE_KEEP_SMOKE_DIR: "1"
          MURAGE_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge murage || true
      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="release/Murage-${version}-x86_64.AppImage"
          deb="release/Murage-${version}-amd64.deb"
          test -f "$appimage"
          test -f "$deb"
          cp "$appimage" release/Murage.AppImage
          cp "$deb" release/Murage-amd64.deb
          chmod 0755 release/Murage.AppImage
          (
            cd release
            sha256sum \
              "$(basename "$appimage")" \
              "$(basename "$deb")" \
              Murage.AppImage \
              Murage-amd64.deb > SHA256SUMS-ubuntu-x64.txt
          )
          echo "artifact-name=murage-ubuntu-${version}-x64" >> "$GITHUB_OUTPUT"
          echo "version: $version"
          echo "commit:  $(git rev-parse HEAD)"
          cat release/SHA256SUMS-ubuntu-x64.txt
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: murage-ubuntu-smoke-diagnostics
          path: |
            /tmp/murage-linux-smoke-*
            /tmp/murage-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: |
            release/Murage-*-amd64.deb
            release/Murage-*-x86_64.AppImage
            release/Murage-amd64.deb
            release/Murage.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
          if-no-files-found: error
          retention-days: 14

  verify-published:
    name: Verify published Linux update from accepted artifact
    if: inputs.source_run_id != '' || inputs.expected_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      # Keep this tooling revision; the artifact's separate source SHA is
      # verified below, never substituted for the updated proof script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate the accepted artifact source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.ref }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const { SOURCE_RUN_ID: id, SOURCE_SHA: sha, EXPECTED_VERSION: version, GITHUB_REPOSITORY: repo } = process.env;
          assert.match(id ?? '', /^[1-9]\d*$/, 'source_run_id is required in verification mode');
          assert.match(sha ?? '', /^[a-f0-9]{40}$/, 'ref must be the full accepted source SHA');
          assert.match(version ?? '', /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'expected_version must be stable X.Y.Z');
          const get = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const pages = (path) => JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', path], { encoding: 'utf8' }));
          const run = get(`repos/${repo}/actions/runs/${id}`);
          assert.equal(run.head_sha, sha, 'run source differs from accepted SHA');
          assert.equal(run.repository.full_name, repo);
          assert.equal(run.head_repository.full_name, repo, 'fork artifacts are not accepted');
          assert.equal(run.status, 'completed');
          const release = run.path === '.github/workflows/release.yml';
          assert.ok(release || run.path === '.github/workflows/package-linux.yml', 'unsupported artifact workflow');
          const jobName = release ? 'Ubuntu 24.04 x64' : 'DEB + AppImage (Ubuntu 24.04 x64)';
          const jobs = pages(`repos/${repo}/actions/runs/${id}/jobs?filter=latest&per_page=100`).flatMap(page => page.jobs);
          const matchingJobs = jobs.filter(job => job.name === jobName);
          assert.equal(matchingJobs.length, 1, 'expected one Linux producer job');
          assert.equal(matchingJobs[0].conclusion, 'success', 'Linux producer did not pass');
          const blob = get(`repos/${repo}/contents/package.json?ref=${sha}`);
          assert.equal(blob.encoding, 'base64');
          assert.equal(JSON.parse(Buffer.from(blob.content, 'base64').toString('utf8')).version, version);
          const name = release ? 'linux-release' : `murage-ubuntu-${version}-x64`;
          const artifacts = pages(`repos/${repo}/actions/runs/${id}/artifacts?per_page=100`).flatMap(page => page.artifacts);
          const matches = artifacts.filter(artifact => artifact.name === name && artifact.expired === false);
          assert.equal(matches.length, 1, 'expected one unexpired accepted Linux artifact');
          const artifact = matches[0];
          assert.equal(artifact.workflow_run?.id, Number(id));
          assert.equal(artifact.workflow_run?.head_sha, sha);
          assert.match(artifact.digest ?? '', /^sha256:[a-f0-9]{64}$/, 'artifact digest is unavailable');
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_id=${artifact.id}\n`);
          console.log(`Accepted ${sha}, version ${version}, artifact ${artifact.id} (${artifact.digest})`);
          EOF
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: artifact-input
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - run: pnpm install --frozen-lockfile
      - name: Prepare the existing package for live-feed proof
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          sudo apt-get update && sudo apt-get install -y at-spi2-core dbus-x11 libxi6 libxkbcommon0 squashfs-tools xvfb
          mkdir -p release
          image="Murage-$EXPECTED_VERSION-x86_64.AppImage"
          # There is exactly one AppImage in release/: the stable-named copy
          # stays in artifact-input and cannot confuse onlyAppImage().
          test -s "artifact-input/$image"
          cp "artifact-input/$image" "release/$image"
          chmod 0755 "release/$image"
          offset=$("release/$image" --appimage-offset)
          case "$offset" in ''|*[!0-9]*) echo "Invalid AppImage offset" >&2; exit 1;; esac
          unsquashfs -no-progress -offset "$offset" -d release/linux-unpacked "release/$image"
          test -s release/linux-unpacked/resources/app.asar
          test -s release/linux-unpacked/resources/app-update.yml
          node --input-type=commonjs -e "require('electron')"
      - name: Prove the published GitHub feed and installed path
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: pnpm smoke:linux-update --expected-version="$EXPECTED_VERSION"
