name: Fuigo platform isolation qualification
on:
  push:
    branches: [work/0150-updater-platforms]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Compile Windows native helpers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          node scripts/build-fuigo-probe.mjs --with-canary
          if errorlevel 1 exit /b %errorlevel%
      - name: Compile Linux native helpers
        if: runner.os == 'Linux'
        run: node scripts/build-fuigo-probe.mjs --with-canary
      - name: Qualify Linux native boundary on synthetic owned fixtures
        # Unchanged primitive already passed at dca26328, run34454039012.
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: node scripts/qualify-fuigo-isolation.mjs
      - name: Qualify Windows native boundary without administrator authority
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\dist-native\fuigo-probe\win32-x64\standard-user.exe (Get-Command node).Source scripts/qualify-fuigo-isolation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify exact Fuigo1.0.10 full offline session on Linux
        if: runner.os == 'Linux'
        run: node scripts/qualify-fuigo-native.mjs
      - name: Qualify exact Fuigo1.0.10 full offline session on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\dist-native\fuigo-probe\win32-x64\standard-user.exe (Get-Command node).Source scripts/qualify-fuigo-native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fuigo-isolation-${{ runner.os }}
          path: .planning/0150-platform-native
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
