# Manual input builder. All three targets are assembled on Linux.
name: Signal runtime inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    timeout-minutes: 60
    env:
      SIGNAL_BUILDER_IMAGE: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build all three runtime inputs
        run: bash scripts/build-signal-runtime-inputs.sh signal-runtime-inputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-runtime-inputs
          path: |
            signal-runtime-inputs/*.tar.gz
            signal-runtime-inputs/pin-fragment-*.json
            signal-runtime-inputs/*.log
            signal-runtime-inputs/SHA256SUMS
            signal-runtime-inputs/container-image.txt
            signal-runtime-inputs/first-build/gradle-verification.SHA256SUMS
            signal-runtime-inputs/second-independent-build/gradle-verification.SHA256SUMS
            signal-runtime-inputs/first-build/*.log
            signal-runtime-inputs/second-independent-build/*.log
          if-no-files-found: error
