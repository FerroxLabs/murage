# One-button releases: builds macOS (arm64 + x64, signed, notarized, stapled),
# Windows, and Ubuntu from ONE commit, assembles a complete draft on
# murage-releases with verified feeds, and publishes after a human
# approves the draft.
#
# Every gate below exists because its absence shipped (or nearly shipped) a
# broken build from a laptop:
#   - clean output dirs        -> 0.1.15 "app is damaged" (stale dist/ broke the seal)
#   - codesign gate BEFORE     -> notarization ACCEPTS invalid signatures
#   - packaged-server smoke    -> 0.1.24 died on launch (unbundled zod import)
#   - proxy-path probe         -> the 0.1.24 fix broke every helper while
#                                 /api/health stayed green
#   - staple, THEN hash        -> stapling rewrites bytes; stale feeds make
#                                 electron-updater reject every update
#   - blockmap regeneration    -> stale differential maps waste every updater's
#                                 bandwidth silently
#   - assemble-then-publish    -> 0.1.24 sat as an invisible draft; a mac-only
#                                 publish 404s the README's other buttons
#   - GEPA receipt per target  -> after-pack refuses a package whose memory
#                                 worker was not built, verified and pinned in
#                                 this run (Intel Mac opts out explicitly)
#   - token write probe        -> a read-only PAT otherwise fails at assemble,
#                                 after every signed build has finished
#
# One-time setup (repo secrets) is documented in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    # Pinning and the preflight checks only. The CI gate is its own job so the
    # platform builds start after the token probe, beside the CI check.
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      should_release: ${{ steps.pin.outputs.should_release }}
      signal_enabled: ${{ steps.signal.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha, not github.ref: on a push the branch tip can already
          # have moved, and a release must pin the exact commit that carried
          # the version bump. fetch-depth 0 so the pre-push blob is readable.
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Read the Signal release gate
        id: signal
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const pin=JSON.parse(fs.readFileSync("server/channels/signal/runtime-pin.json","utf8")); if(pin.g0===undefined)throw Error("Signal pin.g0 is required"); const enabled=pin.g0!==null; fs.appendFileSync(process.env.GITHUB_OUTPUT,`enabled=${enabled}\n`); console.log(enabled ? "Signal required: reviewed pin and all five post-G0 gates must pass" : "Signal omitted: pin.g0 is null; activation remains blocked")'
      - name: Release asset CHECK - public releases and anonymous pinned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-assets.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Release check - require the reviewed Signal pin and all five post-G0 gates
        if: steps.signal.outputs.enabled == 'true'
        env:
          RELEASE: '1'
        run: node scripts/signal-release-check.mjs
      - id: pin
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          current=$(node scripts/release-guard.mjs version)
          echo "version=$current" >> "$GITHUB_OUTPUT"
          should_release=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Fail closed. If the previous package.json cannot be read we
            # cannot tell a version bump from a dependency edit, and guessing
            # either way is wrong: guessing "release" ships an unintended
            # signed build, guessing "skip" silently drops a real release.
            git cat-file -e "$BEFORE:package.json" 2>/dev/null || {
              echo "::error::cannot verify the version before this push; refusing to start a release"
              exit 1
            }
            previous=$(git show "$BEFORE:package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))')
            should_release=$(node scripts/release-guard.mjs should-release "$current" "$previous")
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
      - name: Require the curated release notes for this version
        # package:prepare stages release-notes/<version>.md for the update card
        # and stops a Release run without it. Check here, before any platform
        # build starts, so a missing or rule-breaking note fails in seconds.
        if: steps.pin.outputs.should_release == 'true'
        run: |
          node scripts/release-notes.mjs check "$(node scripts/release-guard.mjs version)" || {
            echo "::error::release notes for this version are missing or break the copy rules (see the message above)"
            exit 1
          }
      - name: Require a review record for every shipped string
        # copy-lint/pending-review.json must be empty at the release cut.
        if: steps.pin.outputs.should_release == 'true'
        run: node scripts/copy-pending-check.mjs

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    needs: [prepare]
    if: needs.prepare.outputs.should_release == 'true'
    # macos-15-xlarge (14 GB): the 8192 MiB compiler cap below needs it.
    runs-on: ${{ vars.MURAGE_MAC_RELEASE_RUNNER || 'macos-15-xlarge' }}
    # package-mac-qualification.yml needs 90 for ONE architecture plus the
    # GEPA build (45-minute cap inside build-mac.py); this job packages both.
    timeout-minutes: 240
    # 1.0.20 (MAIN ruling): server-build peaked at 3022.7 MiB here, over 70% of
    # the recorded 4300 MiB cap. The job declares the ubuntu CI heap as its
    # compiler cap, so the 70% rule holds against 8192 (5734 MiB). Splitting
    # server-build before any further raise is the 1.0.21 follow-up.
    # Full test types run in ci-gate on the 16 GB Linux runner.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      MURAGE_TYPECHECK_CAP_MIB: "8192"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Restore the pinned tool download cache
        # Primary source for age, restic, cloudflared and the other pinned helpers: served by the
        # Actions cache, not github.com release hosting. Files are named by their pinned sha256 and
        # re-verified on every use (scripts/download-retry.mjs), so a stale or bad entry is discarded.
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/package-tool-cache
          key: package-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-cloudflared.mjs', 'shared/backup-age-pins.mjs', 'shared/backup-restic-pin.mjs', 'shared/windows-backup-tools.mjs', 'scripts/prepare-cua.mjs', 'scripts/build-murage-cage.mjs') }}-restore
          restore-keys: |
            package-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-cloudflared.mjs', 'shared/backup-age-pins.mjs', 'shared/backup-restic-pin.mjs', 'shared/windows-backup-tools.mjs', 'scripts/prepare-cua.mjs', 'scripts/build-murage-cage.mjs') }}-
            package-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Point the packagers at the tool download cache
        shell: bash
        run: |
          echo "MURAGE_PACKAGE_DOWNLOAD_CACHE=${{ runner.temp }}/package-tool-cache" >> "$GITHUB_ENV"
          # Authenticated github.com downloads are not in the anonymous (throttled/timing-out) pool.
          echo "MURAGE_PACKAGE_GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
      - name: Restore the Electron and electron-builder toolchain cache
        # electron zips, NSIS and winCodeSign come from github.com; serve them from the Actions cache.
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-toolchain-${{ runner.os }}-${{ runner.arch }}-
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check the shipped Murage release key
        run: node scripts/check-release-key.mjs
      - run: pnpm install --frozen-lockfile
      # Murage for Chrome: the store item ID and public key (plan 2.3). The
      # committed placeholder fails here, so a release cannot ship without it.
      - name: Murage for Chrome release identity
        run: node scripts/release-guard.mjs browser-extension extensions/murage-browser/release.json >> "$GITHUB_ENV"
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release qualification-evidence

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      # Mirrors package-mac-qualification.yml. build-mac.py builds and signs
      # the worker for the runner's OWN arch only (arm64 here), so darwin-x64
      # cannot get a pinned GEPA worker from this runner; Intel Macs ship without
      # it (README "Current boundaries"; smart search is unaffected) and
      # the after-pack gate accepts an explicit "unavailable" pin for that one
      # target. The build reads the pinned SOURCE_SHA and refuses any other.
      - name: Build pinned GEPA worker (darwin-arm64) in the release keychain
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          python3 native/gepa/build-mac.py "$RUNNER_TEMP/gepa-mac-build" "$RUNNER_TEMP/release.keychain-db"

      - name: Restore the memory model download cache
        # Keyed by the pinned revision (the manifest hash). Staging re-verifies every cached file.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/memory-model-cache
          key: memory-model-release-${{ hashFiles('shared/memory-model-manifest.json') }}
      - name: Stage the bundled local memory model
        # Fetches the exact pinned revision, fails on any size or SHA-256 mismatch.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-memory-model.mjs --target darwin-arm64 --out dist-native/memory-model --cache "$RUNNER_TEMP/memory-model-cache"
          node scripts/stage-memory-model.mjs --target darwin-x64 --out dist-native/memory-model --cache "$RUNNER_TEMP/memory-model-cache"
      - name: Rosetta for the x64 package checks
        # after-pack loads the engine-exclusion addon inside each packaged app;
        # the x64 app on this arm64 runner runs through arch -x86_64, which needs Rosetta.
        run: |
          set -euo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true && echo "Rosetta ready"
      - name: Stage reviewed Signal runtime (darwin-arm64)
        if: needs.prepare.outputs.signal_enabled == 'true'
        run: node scripts/stage-signal-runtime.mjs --target darwin-arm64 --release
      - name: Package both architectures
        run: |
          set -euo pipefail
          # Signing opens every file in the bundle; the runner's open-file limits ran out (EMFILE) on 1.0.0.
          # The shell limit alone was not enough: the kernel's per-process cap applies too.
          echo "before: kern.maxfiles=$(sysctl -n kern.maxfiles) kern.maxfilesperproc=$(sysctl -n kern.maxfilesperproc) ulimit=$(ulimit -n)"
          sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=262144 >/dev/null
          ulimit -n 262144 || ulimit -n "$(ulimit -Hn)"
          echo "after: kern.maxfiles=$(sysctl -n kern.maxfiles) kern.maxfilesperproc=$(sysctl -n kern.maxfilesperproc) ulimit=$(ulimit -n)"
          gepa_hash="$(node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("qualification-evidence/gepa-package-metadata.json","utf8")); const h=m.extraMetadata.murageGepaManifests["darwin-arm64"]; if(!/^[a-f0-9]{64}$/.test(h))process.exit(1); process.stdout.write(h)')"
          export MURAGE_REQUIRE_BUNDLED_MODEL=1
          # The x64 package check loads the addon through Rosetta; its first translation of the x64
          # Electron on a fresh arm64 runner can be slow. Translations are cached, so one retry on
          # exactly that error passes (the load itself takes 1-3 s once cached).
          for attempt in 1 2; do
            set +e
            pnpm package:mac \
              "--config.extraMetadata.murageGepaManifests.darwin-arm64=$gepa_hash" \
              "--config.extraMetadata.murageGepaManifests.darwin-x64=unavailable" 2>&1 | tee "$RUNNER_TEMP/package-$attempt.log"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" = 0 ] && break
            if [ "$attempt" = 1 ] && grep -q ENGINE_EXCLUSION_RESOURCE_UNLOADABLE "$RUNNER_TEMP/package-1.log"; then
              echo "x64 addon load failed on the cold Rosetta translation; packaging once more"
              continue
            fi
            exit "$rc"
          done

      - name: Verify packaged Signal inventory (darwin-arm64)
        if: needs.prepare.outputs.signal_enabled == 'true'
        shell: bash
        run: node scripts/signal-inventory.mjs "release/mac-arm64/Murage.app/Contents/Resources/signal-runtime" --target darwin-arm64 --check
      - name: Assert Signal runtime is absent (darwin-arm64)
        if: needs.prepare.outputs.signal_enabled == 'false'
        shell: bash
        run: node scripts/signal-packaging.mjs --assert-absent "release/mac-arm64/Murage.app/Contents/Resources" "release/mac/Murage.app/Contents/Resources"

      - name: Qualify packaged WhatsApp (darwin-arm64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          node scripts/whatsapp-inventory.mjs "release/mac-arm64/Murage.app/Contents/Resources/server" --check
          node scripts/staged-tree-check.mjs "release/mac-arm64/Murage.app/Contents/Resources/server" --max-path 140
          cp "release/mac-arm64/Murage.app/Contents/Resources/server/whatsapp-runtime-manifest.json" qualification-evidence/whatsapp-darwin-arm64-inventory.json
          node scripts/smoke-whatsapp-packaged.mjs --server-directory "release/mac-arm64/Murage.app/Contents/Resources/server" --runtime "release/mac-arm64/Murage.app/Contents/MacOS/Murage" --platform darwin --arch arm64 --electron-version "$(node -p 'require("electron/package.json").version')" > qualification-evidence/whatsapp-darwin-arm64.json 2> qualification-evidence/whatsapp-darwin-arm64-probe.log

      - name: Hand the packaged x64 app to the native Intel smoke job
        # The x64 WhatsApp smoke runs natively on an Intel runner (job mac-x64),
        # not under Rosetta on this arm64 runner. tar keeps modes, symlinks and
        # the signature; the app is the one packaged above, before notarization.
        run: tar -cf "$RUNNER_TEMP/mac-x64-app.tar" -C release/mac Murage.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Not "*-release": assemble must never see this.
          name: mac-x64-app-smoke
          path: ${{ runner.temp }}/mac-x64-app.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The FINAL packaged build.json, not a pre-build directory (handoff 9):
      # release mode, the store identity, no development ID.
      - name: Murage for Chrome identity in the packaged app
        run: |
          set -euo pipefail
          test -f "release/mac-arm64/Murage.app/Contents/Resources/browser-extension/build.json"
          test -f "release/mac-arm64/Murage.app/Contents/Resources/browser-extension/native-host.mjs"
          node scripts/release-guard.mjs browser-extension-build "release/mac-arm64/Murage.app/Contents/Resources/browser-extension/build.json" "$MURAGE_BROWSER_EXTENSION_RELEASE_CONFIG"
          test -f "release/mac/Murage.app/Contents/Resources/browser-extension/build.json"
          test -f "release/mac/Murage.app/Contents/Resources/browser-extension/native-host.mjs"
          node scripts/release-guard.mjs browser-extension-build "release/mac/Murage.app/Contents/Resources/browser-extension/build.json" "$MURAGE_BROWSER_EXTENSION_RELEASE_CONFIG"
      - name: "Gate: arm64 carries the pinned GEPA worker, x64 carries none"
        run: |
          set -euo pipefail
          arm="release/mac-arm64/Murage.app/Contents/Resources"
          x64="release/mac/Murage.app/Contents/Resources"
          test -x "$arm/gepa-worker/gepa-worker" || { echo "::error::arm64 app lacks the pinned GEPA worker"; exit 1; }
          test ! -e "$x64/gepa-worker" || { echo "::error::x64 app carries an unpinned GEPA worker tree"; exit 1; }
          expected="$(node -p 'require("./qualification-evidence/gepa-package-metadata.json").extraMetadata.murageGepaManifests["darwin-arm64"]')"
          actual="$(shasum -a 256 "$arm/gepa-worker/manifest.json" | cut -d' ' -f1)"
          test "$actual" = "$expected" || { echo "::error::packaged GEPA manifest hash $actual != receipt $expected"; exit 1; }
          echo "ok: darwin-arm64 manifest $expected; darwin-x64 opted out"

      - name: "Gate: both packaged apps use the Murage updater feed"
        # app-update.yml is what an installed app reads forever. Anchored on
        # both halves: a substring match on the repo alone would pass a feed
        # pointing at some other account's murage-releases.
        run: |
          for app in release/mac-arm64/Murage.app release/mac/Murage.app; do
            update="$app/Contents/Resources/app-update.yml"
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq '^owner: FerroxLabs$' "$update" || { echo "::error::wrong update owner in $update"; exit 1; }
            grep -Eq '^repo: murage-releases$' "$update" || { echo "::error::wrong update repo in $update"; exit 1; }
          done
          # Exactly the public feed: a qualification build's feed never ships.
          node scripts/release-guard.mjs update-feed release/mac-arm64/Murage.app/Contents/Resources/app-update.yml release/mac/Murage.app/Contents/Resources/app-update.yml

      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          for app in release/mac-arm64/Murage.app release/mac/Murage.app; do
            codesign --verify --deep --strict "$app"
            # What macOS shows when a bot opens these folders: the built plist, not the config.
            for folder in Documents Desktop Downloads; do
              got=$(/usr/libexec/PlistBuddy -c "Print :NS${folder}FolderUsageDescription" "$app/Contents/Info.plist")
              test "$got" = "Murage needs this so your bots can work with files in your $folder folder when you ask." \
                || { echo "::error::wrong $folder purpose string in $app"; exit 1; }
            done
            bin="$app/Contents/Resources/cloudflared/cloudflared"
            test -x "$bin" || { echo "::error::missing executable $bin"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-LICENSE.txt" \
              || { echo "::error::missing cloudflared license in $app"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-README.md" \
              || { echo "::error::missing cloudflared provenance in $app"; exit 1; }
            codesign --verify --strict "$bin"
            app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$app_team" && test "$bin_team" = "$app_team" || {
              echo "::error::cloudflared is not signed by the app's Developer ID team in $app"; exit 1; }
            # Local and off-site backups: age and restic for this app's arch,
            # the pinned payloads, signed by the same team as the app.
            arch=x64
            case "$app" in *mac-arm64*) arch=arm64 ;; esac
            node scripts/verify-packaged-backup-tools.mjs "$app/Contents/Resources" darwin "$arch" \
              || { echo "::error::backup tools missing or unpinned in $app"; exit 1; }
            echo "ok: $app"
          done

      - name: "Gate: packaged Codex hook blocks cleanly in node mode and the guard refuses a lost node mode"
        # 1.0.3: the hook runs as `<Murage binary> <script>`. Proves, on the final packaged arm64 app with a throwaway HOME and a
        # 20 s timeout per run, that the node-mode shape blocks with the script's own reason and the old shape exits 2 with no app.
        run: node scripts/prove-codex-hook-packaged-mac.mjs release/mac-arm64/Murage.app

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/Murage.app release/mac/Murage.app; do
            res="$app/Contents/Resources"
            # the server tree is plain JS — runnable on the runner's node
            # regardless of the app binary's arch
            MURAGE_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
            for bin in "$res/cua-driver" "$res/Murage Speech.app/Contents/MacOS/speech-helper"; do
              lipo -archs "$bin" | grep -q "x86_64" || { echo "::error::$bin lacks x86_64"; exit 1; }
              lipo -archs "$bin" | grep -q "arm64" || { echo "::error::$bin lacks arm64"; exit 1; }
            done
            cloudflared="$res/cloudflared/cloudflared"
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            test "$(lipo -archs "$cloudflared")" = "$expected_arch" || {
              echo "::error::$cloudflared is not the expected $expected_arch executable"; exit 1; }
            if [ "$(uname -m)" = "$expected_arch" ]; then
              "$cloudflared" version | grep -Fq "cloudflared version 2026.10.3 " || {
                echo "::error::$cloudflared has the wrong version"; exit 1; }
            fi
          done

      - name: "Gate: no binary asks for a newer macOS than this app allows"
        run: |
          mkdir -p qualification-evidence
          bash scripts/mac-minos-gate.sh release/mac-arm64/Murage.app qualification-evidence/minos-arm64.json
          bash scripts/mac-minos-gate.sh release/mac/Murage.app qualification-evidence/minos-x64.json

      - name: Notarize all four artifacts
        # A stalled Apple queue used to hold the runner until the JOB timeout;
        # bound each submission and the step so the failure names this step.
        # 1.0.0's bundle took Apple over 20 minutes per file, so all four files
        # are submitted first and then waited on together, with their ids logged.
        timeout-minutes: 100
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          files=() ids=()
          for f in release/*.dmg release/*.zip; do
            id=$(xcrun notarytool submit "$f" "${auth[@]}" --output-format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const id=JSON.parse(s).id;if(!/^[0-9a-f-]{36}$/.test(id??""))process.exit(1);process.stdout.write(id)})')
            echo "submitted $f as $id"
            files+=("$f"); ids+=("$id")
          done
          for i in "${!ids[@]}"; do
            out=$(xcrun notarytool wait "${ids[$i]}" "${auth[@]}" --timeout 90m 2>&1) || true
            echo "$out" | tail -2
            if ! echo "$out" | grep -q "status: Accepted"; then
              xcrun notarytool log "${ids[$i]}" "${auth[@]}" 2>&1 | tail -40 || true
              echo "::error::notarization not Accepted for ${files[$i]} (${ids[$i]})"; exit 1
            fi
          done

      # stapler speaks HTTP/3 and that path drops on macos-15 runners (Error 68, about 7 s in).
      # Blocking UDP 443 for this job makes it use HTTPS. actions/runner-images#14924.
      - name: Send stapler over HTTPS
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Staple, re-zip, regenerate blockmaps and the feed
        run: |
          # stapler fetches the ticket from Apple: the connection drops now and then (error 68), and a
          # ticket can lag notarytool's Accepted verdict by a minute (error 65). Six tries, 30 s apart.
          # If every try fails the step stops here, before any re-zip, blockmap or feed change.
          staple() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if xcrun stapler staple "$1"; then return 0; fi
              if [ "$attempt" -lt 6 ]; then
                echo "stapling $1 failed (try $attempt of 6); trying again in 30 s"
                sleep 30
              fi
            done
            echo "::error::could not staple $1 after 6 tries"
            return 1
          }
          for f in release/Murage-*-arm64.dmg release/Murage-*-x64.dmg release/mac-arm64/Murage.app release/mac/Murage.app; do
            staple "$f" || exit 1
          done
          v=$(node -p "require('./package.json').version")
          rm -f "release/Murage-$v-arm64.zip" "release/Murage-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Murage.app "release/Murage-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/Murage.app "release/Murage-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/Murage-$v-arm64.zip" "release/Murage-$v-x64.zip" \
            "release/Murage-$v-arm64.dmg" "release/Murage-$v-x64.dmg"
          # refreshes every hash from the post-staple bytes and refuses to
          # finish unless the feed matches the files on disk
          node scripts/regenerate-mac-feed.mjs

      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Murage-$v-arm64.dmg" release/Murage.dmg
          cp "release/Murage-$v-x64.dmg" release/Murage-intel.dmg

      - name: Bind WhatsApp reports to final artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bind-whatsapp-artifacts.mjs qualification-evidence/whatsapp-darwin-arm64.json release/Murage-*-arm64.dmg release/Murage-*-arm64.zip release/Murage-*-arm64.*.blockmap release/Murage.dmg release/latest-mac.yml
      - name: Preserve WhatsApp qualification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Retain the existing evidence suffix; assemble selects only *-release.
          name: mac-whatsapp-gepa-evidence
          path: qualification-evidence/whatsapp-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
      - name: Preserve sanitized GEPA stage evidence
        if: always()
        run: node scripts/collect-gepa-build-evidence.mjs "$RUNNER_TEMP/gepa-mac-build" "$PWD/qualification-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mac-gepa-evidence
          path: qualification-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Save the Electron and electron-builder toolchain cache
        if: success() && steps.electron-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Fingerprint the tool download cache
        id: tool-sig
        if: always()
        shell: bash
        run: |
          dir="${{ runner.temp }}/package-tool-cache"
          sig=""
          if [ -d "$dir" ] && [ -n "$(ls -A "$dir")" ]; then sig="$(ls "$dir" | sort | sha256sum | cut -c1-16)"; fi
          echo "sig=$sig" >> "$GITHUB_OUTPUT"
      - name: Save the pinned tool download cache
        # Saves a new generation whenever the set of verified files changed (even if a later step failed), so a
        # partial cache is topped up instead of being frozen under one key.
        if: always() && steps.tool-sig.outputs.sig != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/package-tool-cache
          key: package-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-cloudflared.mjs', 'shared/backup-age-pins.mjs', 'shared/backup-restic-pin.mjs', 'shared/windows-backup-tools.mjs', 'scripts/prepare-cua.mjs', 'scripts/build-murage-cage.mjs') }}-${{ steps.tool-sig.outputs.sig }}

