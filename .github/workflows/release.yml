# One-button releases: builds macOS (arm64 + x64, signed, notarized, stapled),
# Windows, and Ubuntu from ONE commit, assembles a complete draft on
# murage-releases with verified feeds, and publishes after a human
# approves the draft.
#
# Every gate below exists because its absence shipped (or nearly shipped) a
# broken build from a laptop:
#   - clean output dirs        -> 0.1.15 "app is damaged" (stale dist/ broke the seal)
#   - codesign gate BEFORE     -> notarization ACCEPTS invalid signatures
#   - packaged-server smoke    -> 0.1.24 died on launch (unbundled zod import)
#   - proxy-path probe         -> the 0.1.24 fix broke every helper while
#                                 /api/health stayed green
#   - staple, THEN hash        -> stapling rewrites bytes; stale feeds make
#                                 electron-updater reject every update
#   - blockmap regeneration    -> stale differential maps waste every updater's
#                                 bandwidth silently
#   - assemble-then-publish    -> 0.1.24 sat as an invisible draft; a mac-only
#                                 publish 404s the README's other buttons
#
# One-time setup (repo secrets) is documented in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false
  # Merging a version bump to main IS the release trigger. `publish` is a
  # workflow_dispatch input only, so a push-started run leaves a DRAFT — a
  # human still publishes it. The should_release guard below is what keeps
  # an unrelated package.json edit from starting a signed build.
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      should_release: ${{ steps.pin.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha, not github.ref: on a push the branch tip can already
          # have moved, and a release must pin the exact commit that carried
          # the version bump. fetch-depth 0 so the pre-push blob is readable.
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: pin
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          current=$(node scripts/release-guard.mjs version)
          echo "version=$current" >> "$GITHUB_OUTPUT"
          should_release=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Fail closed. If the previous package.json cannot be read we
            # cannot tell a version bump from a dependency edit, and guessing
            # either way is wrong: guessing "release" ships an unintended
            # signed build, guessing "skip" silently drops a real release.
            git cat-file -e "$BEFORE:package.json" 2>/dev/null || {
              echo "::error::cannot verify the version before this push; refusing to start a release"
              exit 1
            }
            previous=$(git show "$BEFORE:package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))')
            should_release=$(node scripts/release-guard.mjs should-release "$current" "$previous")
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published release
        if: steps.pin.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          node scripts/release-guard.mjs available "$(node scripts/release-guard.mjs version)"

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package both architectures
        run: pnpm package:mac

      - name: "Gate: both packaged apps use the Murage updater feed"
        # app-update.yml is what an installed app reads forever. Anchored on
        # both halves: a substring match on the repo alone would pass a feed
        # pointing at some other account's murage-releases.
        run: |
          for app in release/mac-arm64/Murage.app release/mac/Murage.app; do
            update="$app/Contents/Resources/app-update.yml"
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq '^owner: FerroxLabs$' "$update" || { echo "::error::wrong update owner in $update"; exit 1; }
            grep -Eq '^repo: murage-releases$' "$update" || { echo "::error::wrong update repo in $update"; exit 1; }
          done

      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          for app in release/mac-arm64/Murage.app release/mac/Murage.app; do
            codesign --verify --deep --strict "$app"
            bin="$app/Contents/Resources/cloudflared/cloudflared"
            test -x "$bin" || { echo "::error::missing executable $bin"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-LICENSE.txt" \
              || { echo "::error::missing cloudflared license in $app"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-README.md" \
              || { echo "::error::missing cloudflared provenance in $app"; exit 1; }
            codesign --verify --strict "$bin"
            app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$app_team" && test "$bin_team" = "$app_team" || {
              echo "::error::cloudflared is not signed by the app's Developer ID team in $app"; exit 1; }
            echo "ok: $app"
          done

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/Murage.app release/mac/Murage.app; do
            res="$app/Contents/Resources"
            # the server tree is plain JS — runnable on the runner's node
            # regardless of the app binary's arch
            MURAGE_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
            for bin in "$res/cua-driver" "$res/Murage Speech.app/Contents/MacOS/speech-helper"; do
              lipo -archs "$bin" | grep -q "x86_64" || { echo "::error::$bin lacks x86_64"; exit 1; }
              lipo -archs "$bin" | grep -q "arm64" || { echo "::error::$bin lacks arm64"; exit 1; }
            done
            cloudflared="$res/cloudflared/cloudflared"
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            test "$(lipo -archs "$cloudflared")" = "$expected_arch" || {
              echo "::error::$cloudflared is not the expected $expected_arch executable"; exit 1; }
            if [ "$(uname -m)" = "$expected_arch" ]; then
              "$cloudflared" version | grep -Fq "cloudflared version 2026.8.2 " || {
                echo "::error::$cloudflared has the wrong version"; exit 1; }
            fi
          done

      - name: Notarize all four artifacts
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg release/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: Staple, re-zip, regenerate blockmaps and the feed
        run: |
          xcrun stapler staple release/Murage-*-arm64.dmg
          xcrun stapler staple release/Murage-*-x64.dmg
          xcrun stapler staple release/mac-arm64/Murage.app
          xcrun stapler staple release/mac/Murage.app
          v=$(node -p "require('./package.json').version")
          rm -f "release/Murage-$v-arm64.zip" "release/Murage-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Murage.app "release/Murage-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/Murage.app "release/Murage-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/Murage-$v-arm64.zip" "release/Murage-$v-x64.zip" \
            "release/Murage-$v-arm64.dmg" "release/Murage-$v-x64.dmg"
          # refreshes every hash from the post-staple bytes and refuses to
          # finish unless the feed matches the files on disk
          node scripts/regenerate-mac-feed.mjs

      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Murage-$v-arm64.dmg" release/Murage.dmg
          cp "release/Murage-$v-x64.dmg" release/Murage-intel.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Package (Azure Trusted Signing)
        run: pnpm package:win
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # The mac job gates on codesign BEFORE notarizing, for the same reason
      # this gate exists: a build that silently skipped signing looks entirely
      # normal until a user's SmartScreen says otherwise. Prove it, do not
      # assume it.
      - name: "Gate: the installer must actually be signed"
        shell: pwsh
        run: |
          # Every executable we ship must carry a VALID signature, ours or a
          # vendor's. But we bundle third-party binaries (cloudflared) that are
          # signed by their own publisher, so demanding our subject everywhere
          # rejects a perfectly good Cloudflare signature. Allowlist the
          # vendors by name rather than skipping them: a swapped binary with a
          # different signer still fails this gate.
          $allowed = @('Ferrox Labs, LLC', 'Cloudflare, Inc.')
          $script:fail = 0
          Get-ChildItem release -Filter *.exe -Recurse | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            $subject = $sig.SignerCertificate.Subject
            Write-Host "$($_.Name): $($sig.Status) $subject"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($_.Name) is not validly signed ($($sig.Status))"; $script:fail = 1
            } elseif (-not ($allowed | Where-Object { $subject -match [regex]::Escape($_) })) {
              Write-Host "::error::$($_.Name) signed by an unexpected subject: $subject"; $script:fail = 1
            }
          }
          # The app and bundled first-party engine must be signed by us.
          foreach ($required in @('Murage.exe', 'Murage-*-setup.exe', 'fuigo.exe')) {
            Get-ChildItem release -Filter $required -Recurse | ForEach-Object {
              $subject = (Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject
              if ($subject -notmatch 'Ferrox Labs, LLC') {
                Write-Host "::error::$($_.Name) must be signed by us, got: $subject"; $script:fail = 1
              }
            }
          }
          exit $script:fail

      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -Eq '^owner: FerroxLabs$' "$res/app-update.yml" || { echo "::error::wrong update owner"; exit 1; }
          grep -Eq '^repo: murage-releases$' "$res/app-update.yml" || { echo "::error::wrong update repo"; exit 1; }
          # Now that the build is signed, the inverse is the danger: without
          # publisherName electron-updater skips verification entirely, and a
          # mismatch rejects every update as untrusted.
          grep -q "publisherName" "$res/app-update.yml" || {
            echo "::error::app-update.yml has no publisherName on a signed build"; exit 1; }
          grep -q "Ferrox Labs, LLC" "$res/app-update.yml" || {
            echo "::error::app-update.yml publisherName does not match the signing certificate"; exit 1; }
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" MURAGE_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Murage-$v-setup.exe" release/Murage-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - run: pnpm package:linux
      - name: Verify the packaged updater target
        run: |
          update=release/linux-unpacked/resources/app-update.yml
          test -f "$update" || { echo "::error::missing $update"; exit 1; }
          grep -Eq '^owner: FerroxLabs$' "$update" || { echo "::error::wrong update owner"; exit 1; }
          grep -Eq '^repo: murage-releases$' "$update" || { echo "::error::wrong update repo"; exit 1; }
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Smoke the packages
        env:
          MURAGE_KEEP_SMOKE_DIR: "1"
          MURAGE_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Prove the handed-over install command works on a clean Ubuntu
        # The .deb path no longer prompts for root from inside the app; it
        # hands the user a command. This proves that command actually installs
        # and resolves dependencies, which dpkg -i did not.
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          pnpm smoke:deb-command "${deb[0]}"
      - name: Prove an AppImage update lands on the launched path
        # Mandatory prepublication proof against an isolated candidate feed.
        # After publication, rerun without --candidate-feed for live GitHub proof.
        run: pnpm smoke:linux-update --candidate-feed
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge murage || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Murage-$v-amd64.deb" release/Murage-amd64.deb
          cp "release/Murage-$v-x86_64.AppImage" release/Murage.AppImage
          (cd release && sha256sum Murage-$v-amd64.deb Murage-$v-x86_64.AppImage > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble the draft and verify every feed
    needs: [prepare, mac, windows, linux]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    # generate-notes is a POST and needs Contents: write. Granted here rather
    # than at the workflow level so the build jobs stay read-only.
    permissions:
      contents: write
    timeout-minutes: 30
    concurrency:
      group: release-assemble-v${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Refuse an incomplete installer or updater set
        # A release missing one stable download name or one feed is the
        # failure that strands users silently: the README button 404s, or an
        # installed app never sees the update. Name every file the release
        # must carry, and refuse anything extra so a stray artifact cannot
        # ride along unnoticed.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          required=(
            latest-linux.yml latest-mac.yml latest.yml
            "Murage-$VERSION-amd64.deb"
            "Murage-$VERSION-arm64.dmg"
            "Murage-$VERSION-arm64.dmg.blockmap"
            "Murage-$VERSION-arm64.zip"
            "Murage-$VERSION-arm64.zip.blockmap"
            "Murage-$VERSION-setup.exe"
            "Murage-$VERSION-setup.exe.blockmap"
            "Murage-$VERSION-x64.dmg"
            "Murage-$VERSION-x64.dmg.blockmap"
            "Murage-$VERSION-x64.zip"
            "Murage-$VERSION-x64.zip.blockmap"
            "Murage-$VERSION-x86_64.AppImage"
            Murage-amd64.deb Murage-intel.dmg Murage-setup.exe
            Murage.AppImage Murage.dmg SHA256SUMS-ubuntu-x64.txt
          )
          for file in "${required[@]}"; do
            test -s "assets/$file" || { echo "::error::missing or empty release asset: $file"; exit 1; }
          done
          test "$(find assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#required[@]}" || {
            echo "::error::unexpected release asset set"; find assets -maxdepth 1 -type f -print; exit 1; }
      - name: Verify every feed hash against the actual bytes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd assets
          node --input-type=module - "$VERSION" <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync } from "node:fs";
          const version = process.argv[2];
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          // Naming the files each feed must list turns "the feed happens to be
          // absent" and "the feed lists nothing" from silent passes into
          // failures. The old loop skipped a missing feed entirely.
          const expected = new Map([
            ["latest-mac.yml", [
              `Murage-${version}-x64.zip`,
              `Murage-${version}-arm64.zip`,
              `Murage-${version}-x64.dmg`,
              `Murage-${version}-arm64.dmg`,
            ]],
            ["latest.yml", [`Murage-${version}-setup.exe`]],
            ["latest-linux.yml", [
              `Murage-${version}-x86_64.AppImage`,
              `Murage-${version}-amd64.deb`,
            ]],
          ]);
          let bad = 0;
          for (const [feed, expectedUrls] of expected) {
            const text = readFileSync(feed, "utf8");
            const entries = [...text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)];
            const urls = entries.map(([, url]) => url).sort();
            if (JSON.stringify(urls) !== JSON.stringify([...expectedUrls].sort())) {
              console.error(`WRONG PATHS in ${feed}: ${urls.join(", ") || "none"}`);
              bad++;
              continue;
            }
            for (const [, url, hash, size] of entries) {
              const okHash = sha512(url) === hash;
              const okSize = statSync(url).size === Number(size);
              if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
              else console.log(`ok ${url}`);
            }
          }
          if (bad) process.exit(1);
          console.log(`\nall feeds verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Generate the release notes from merged pull requests
        # The draft body used to be a hand-written placeholder nobody replaced.
        # The releases repo holds no commits, so the notes are generated
        # against the SOURCE repo (categories come from .github/release.yml
        # there) and handed to the releases repo as a file. A failure here is
        # cosmetic, never fatal: fall back to naming the pinned commit.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" -f target_commitish="$SHA" --jq .body > "$notes" \
              && [ -s "$notes" ]; then
            echo "generated $(wc -l < "$notes") lines of release notes"
          else
            printf 'Built by the release workflow from %s@%s.\n' "$GITHUB_REPOSITORY" "$SHA" > "$notes"
            echo "::warning::could not generate notes from pull requests; using the commit reference"
          fi
      - name: Create or update the draft with the complete asset set
        id: upload
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Rechecks draft status at every upload boundary and binds uploads
          # to one numeric release ID. Existing assets must match exactly;
          # there is no automatic delete or --clobber path.
          release_id=$(node scripts/release-guard.mjs upload "$VERSION" assets "$RUNNER_TEMP/release-notes.md")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Prove the draft holds the exact staged bytes
        # An upload that half-succeeded is invisible until a user's download
        # fails its checksum.
        # Compare GitHub's own digest for every asset against what we staged.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ steps.upload.outputs.release_id }}
        run: |
          node --input-type=module - "$VERSION" <<'EOF'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const version = process.argv[2];
          const expected = new Map(readdirSync("assets").map((name) => [
            name,
            `sha256:${createHash("sha256").update(readFileSync(join("assets", name))).digest("hex")}`,
          ]));
          const { assertDraft } = await import("./scripts/release-guard.mjs");
          const view = () => assertDraft(version, Number(process.env.RELEASE_ID)).assets;
          // Names and upload state are deterministic and available the moment
          // gh answers, so they are checked unconditionally. Digests are
          // GitHub's and are computed asynchronously, so those get a bounded
          // wait before we accept "not reported" — the earlier version took
          // the first null as final, which let a wrong NAME through whenever
          // the digest had simply not landed yet.
          let assets = view();
          if (assets.length !== expected.size) {
            throw new Error(`expected ${expected.size} assets on the draft, got ${assets.length}`);
          }
          const missing = [...expected.keys()].filter((name) => !assets.some((a) => a.name === name));
          const extra = assets.filter((a) => !expected.has(a.name)).map((a) => a.name);
          if (missing.length || extra.length) {
            throw new Error(`asset names differ — missing: ${missing.join(", ") || "none"}; unexpected: ${extra.join(", ") || "none"}`);
          }
          const pending = assets.filter((a) => a.state && a.state !== "uploaded").map((a) => a.name);
          if (pending.length) {
            throw new Error(`assets not finished uploading: ${pending.join(", ")}`);
          }
          for (let attempt = 0; attempt < 6 && assets.some((a) => !a.digest); attempt += 1) {
            execFileSync("sleep", ["10"]);
            assets = view();
          }
          const unreported = assets.filter((asset) => !asset.digest).map((asset) => asset.name);
          for (const asset of assets) {
            if (!asset.digest) continue;
            if (expected.get(asset.name) !== asset.digest) {
              throw new Error(`digest mismatch for ${asset.name}`);
            }
          }
          if (unreported.length > 0) {
            console.log(`::warning::GitHub reported no digest after 60s for ${unreported.length} asset(s): ${unreported.join(", ")}`);
          }
          console.log(`ok: the draft has ${assets.length} assets, ${assets.length - unreported.length} digest-verified`);
          EOF

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ steps.upload.outputs.release_id }}
        run: |
          node scripts/release-guard.mjs publish "$VERSION" "$RELEASE_ID"
          echo "v$VERSION is live"
