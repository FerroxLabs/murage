# Release rule: the Windows build must install and start as a STANDARD
# (non-admin) user. Runs on a GitHub-hosted windows-latest runner only;
# never point this at a real machine.
#
# Dispatch with the run id of a successful "Package Windows" run; it
# downloads that run's windows-installer artifact and checks it.
name: Windows standard-user install check

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: 'Run id of a successful "Package Windows" run (artifact: windows-installer)'
        required: true
        type: string

jobs:
  stduser:
    name: install + start + uninstall as a standard user
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: Download the installer artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.package_run_id }}
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw 'package_run_id must be digits' }
          New-Item -ItemType Directory -Force C:\inst | Out-Null
          gh run download $env:RUN_ID -R $env:GITHUB_REPOSITORY -n windows-installer -D C:\inst
          $exe = @(Get-ChildItem C:\inst -Filter 'Murage-*-setup.exe' -File)
          if ($exe.Count -ne 1) { throw "expected exactly one Murage-*-setup.exe, found $($exe.Count)" }
          Rename-Item $exe[0].FullName 'setup.exe'
          $sig = Get-AuthenticodeSignature C:\inst\setup.exe
          "installer=$($exe[0].Name) sha256=$((Get-FileHash C:\inst\setup.exe).Hash) sig=$($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw 'installer signature not Valid' }
      - name: Create the standard user (password never printed)
        shell: pwsh
        run: |
          $chars = [char[]]([char]'a'..[char]'z' + [char]'A'..[char]'Z' + [char]'0'..[char]'9')
          $bytes = [byte[]]::new(24); [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $pw = 'Aa1!' + (-join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] }))
          Write-Output "::add-mask::$pw"
          "STD_PW=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "STD_USER=mrgstd" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:PW = $pw
          net user mrgstd $env:PW /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'net user /add failed' }
          # standard user: member of Users only, never Administrators
          $admins = (net localgroup Administrators) -join "`n"
          if ($admins -match '\bmrgstd\b') { throw 'user is in Administrators' }
          net localgroup Users mrgstd /add 2>$null | Out-Null
          # the user needs to read the installer and own a scratch dir
          icacls C:\inst /grant 'mrgstd:(OI)(CI)RX' /T /Q | Out-Null
          New-Item -ItemType Directory -Force C:\stdchk | Out-Null
          icacls C:\stdchk /grant 'mrgstd:(OI)(CI)M' /Q | Out-Null
          Copy-Item ci\std-user-check.ps1 C:\stdchk\std-user-check.ps1
          "node=$((Get-Command node).Source)"
          "NODE_EXE=$((Get-Command node).Source)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Run the check as the standard user
        shell: pwsh
        run: |
          $sec = ConvertTo-SecureString $env:STD_PW -AsPlainText -Force
          $cred = [pscredential]::new($env:STD_USER, $sec)
          $p = Start-Process powershell.exe -Credential $cred -LoadUserProfile -WorkingDirectory C:\stdchk -PassThru -Wait `
            -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','C:\stdchk\std-user-check.ps1','-Installer','C:\inst\setup.exe','-Node',$env:NODE_EXE `
            -RedirectStandardOutput C:\stdchk\out.log -RedirectStandardError C:\stdchk\err.log
          Get-Content C:\stdchk\out.log, C:\stdchk\err.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "standard-user check failed, exit $($p.ExitCode)" }
      - name: Clean up the user
        if: always()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.Path -like 'C:\Users\mrgstd\*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          net user mrgstd /delete 2>$null | Out-Null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-standard-user-evidence
          path: |
            C:\stdchk\out.log
            C:\stdchk\err.log
            C:\stdchk\result.json
          if-no-files-found: warn
          retention-days: 7
