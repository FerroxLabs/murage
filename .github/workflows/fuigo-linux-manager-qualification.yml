name: Fuigo Linux full manager qualification
on:
  push:
    branches: [work/0150-updater-linux-manager]
    paths:
      - .github/workflows/fuigo-linux-manager-qualification.yml
      - .planning/linux-fuigo-manager-closeout.mjs
      - server/engine-management.ts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuigo-linux-manager-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          architecture: x64
      - name: Check exact manager fixture syntax
        run: node --check .planning/linux-fuigo-manager-closeout.mjs
      - name: Compile accepted Linux isolation helper
        run: node scripts/build-fuigo-probe.mjs
      - name: Qualify full production manager update and rollback
        run: node .planning/linux-fuigo-manager-closeout.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fuigo-linux-manager-${{ github.run_id }}-${{ github.run_attempt }}
          path: .planning/0150-linux-manager-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
