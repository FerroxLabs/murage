schema: 1
entries:
  - id: skills.library
    name: The Skills Library
    status: can
    questions:
      - Where can I find skills for my bot?
      - Does Murage have a library of skills?
      - How do I add a skill to a bot?
      - Can I change a library skill?
      - How do I undo my edits to a skill?
    answer: >
      Yes. The Library window's Skills tab holds 2,247 skills across 141 topics. Search, pick a topic,
      or narrow to On your bots or Your copies. Open a skill to read its instructions and files, then use
      Add or remove bots to choose which bots use it. Save as my copy keeps your edits yours, and Go back to
      the original returns a skill to the library version.
    limits: Skill Guard checks a skill before a bot can use it. Skills are in the desktop app only.
    platforms: [mac, windows, linux]
    engines: [all]
    anchors:
      - 'file:src/components/TeamLibraryPanel.tsx#<SkillsBrowser bots={assignableBots}'
      - 'file:src/components/library/SkillsBrowser.tsx#label: "Your copies"'
      - 'file:src/components/library/SkillDetailPane.tsx#Go back to the original'
      - 'file:src/components/library/BotsPicker.tsx#Add or remove bots'
      - 'file:server/index.ts#path === "/api/library/topics"'
    verified: 1.0.19
    since: 1.0.19
    doc: features/skills#overview
    internal: 1.0.19 headline. The 2,247 skills and 141 topics are asserted by server/skills-library-shipped.test.ts against the shipped library; update both when the library changes. Settings → Skills (useSkillsBrowser, features/skills#settings-skills) is the older list and still exists beside the Library tab.
retired: []
