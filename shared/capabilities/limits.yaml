# Capability records: limits. Schema and rules: scripts/build-capability-db.mjs.
schema: 1
entries:
  - id: limits.spending-per-bot
    name: A spending cap for each bot
    status: partial
    questions:
      - Can I set a spending limit per bot?
      - Cap how much one bot spends
      - Set a budget for each bot
      - Stop a bot when it costs too much
    answer: >
      Partly. Settings, Usage shows this month's use by bot, a project can have a work budget in
      minutes, and memory learning has a monthly limit. There is no money cap for one bot.
    limits: >
      No money cap per bot. Watch Usage, give a project a work budget, or keep the bot on Ask so it
      checks with you first.
    ask_your_bot: Ask your bot to set up a weekly routine that reminds you to review Usage.
    settings_path: Settings → Usage → This month by bot
    platforms: [all]
    engines: [all]
    anchors:
      - settings-card:usage/by-bot
      - settings-card:usage/limit
      - file:src/locales/en.json#projects.work.budgetHint
    verified: 1.0.10
    internal: KB limits-41. No per-bot spend cap in server, shared or src/lib (searched 1.0.10).
  - id: limits.plan-usage
    name: View plan usage
    status: partial
    questions:
      - How much of my plan have I used?
      - When does my plan limit reset?
      - Where can I check plan usage?
    answer: >
      Settings, Usage shows the plan use last reported by an engine, when it was checked,
      and the reported reset time. Use Refresh to check again.
    limits: >
      Readings are available when Codex reports them. Other engines and Murage Cloud may
      show no reading. A reset time does not confirm that more use is available.
    ask_your_bot: Ask your bot to remind you to check your engine account when no reading is available.
    settings_path: Settings → Usage
    platforms: [all]
    engines: [codex]
    anchors:
      - route:/api/plan-usage
      - file:src/components/PlanUsageCard.tsx#PlanUsageCard
    verified: 1.0.17
retired: []
