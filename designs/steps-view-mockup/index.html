<!doctype html>
<html lang="en" data-skin="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steps view r3 mockup (Murage 1.0.22)</title>
<!--
  Static mockup for designs/STEPS-VIEW-1022.md r3. No build step, no network.
  - Colour tokens are copied verbatim from src/styles.css ([data-skin="dark"] and [data-skin="light"]) at dev/1022 b45d0259e6.
  - Sizes follow the app: chat 15px, pill and rows 13px, code 13px, right column 12px, chrome 11px.
  - Icons are lucide paths (the app uses lucide-react). Code colours are the Shiki themes the app's code block uses
    (github-dark-default / github-light-default); they are not app tokens.
  - URL: ?skin=dark|light  &only=<screen id>  shows one screen at real app size (1280x800, or 390 wide for p-* screens).
  - The app switches to the phone layout with its media query (max-width: 767.98px). This file uses a container query
    with the same width so a phone frame can sit on a wide page.
-->
<style>
[data-skin="dark"]{
  --code-color-scheme:dark;
  --color-app:#0a0a0a;--color-panel:#171717;--color-card:#1f1f1f;--color-inset:#121212;--color-raised:#2a2a2a;--color-raised-hover:#353535;
  --color-control:#2a2a2a;--color-control-hover:#353535;--color-hairline:#4d4d4d;
  --color-ink:#f5f5f5;--color-ink-secondary:#a8a8a8;
  --color-accent:#ff6b35;--color-accent-border:#ff8255;--color-accent-text:#ff8255;--color-focus:#ff8255;--color-accent-ink:#2a1207;--color-bubble-user:#33241a;
  --color-success:#34d399;--color-danger:#f87171;--color-warning:#fbbf24;
  --color-accent-soft:#3a2216;--color-success-soft:#123326;--color-warning-soft:#352a0e;--color-danger-soft:#3d1c1c;
  --color-scrollbar:#5c5c5c;
  /* Shiki github-dark-default */
  --sk-kw:#ff7b72;--sk-str:#a5d6ff;--sk-com:#8b949e;--sk-fn:#d2a8ff;--sk-num:#79c0ff;
}
[data-skin="light"]{
  --code-color-scheme:light;
  --color-app:#f7f7f7;--color-panel:#f0f0f0;--color-card:#ffffff;--color-raised:#ffffff;--color-inset:#eaeaea;--color-raised-hover:#e5e5e5;
  --color-control:#d4d4d4;--color-control-hover:#c4c4c4;--color-hairline:#bfbfbf;
  --color-ink:#0d0d0d;--color-ink-secondary:#555555;
  --color-accent:#b8481f;--color-accent-border:#cc5529;--color-accent-text:#a83c14;--color-focus:#b8481f;--color-accent-ink:#ffffff;--color-bubble-user:#ffe6db;
  --color-success:#0f7a52;--color-danger:#b3261e;--color-warning:#8a6100;
  --color-accent-soft:#fbe9e1;--color-success-soft:#e1f2ea;--color-warning-soft:#fbf0d9;--color-danger-soft:#fbe7e6;
  --color-scrollbar:#b3b3b3;
  /* Shiki github-light-default */
  --sk-kw:#cf222e;--sk-str:#0a3069;--sk-com:#6e7781;--sk-fn:#8250df;--sk-num:#0550ae;
}
:root{
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  --hair40:color-mix(in srgb,var(--color-hairline) 40%,transparent);
  --hair30:color-mix(in srgb,var(--color-hairline) 30%,transparent);
  --accent40:color-mix(in srgb,var(--color-accent) 40%,transparent);
  --danger40:color-mix(in srgb,var(--color-danger) 40%,transparent);
  --warning40:color-mix(in srgb,var(--color-warning) 40%,transparent);
  --raised30:color-mix(in srgb,var(--color-raised) 30%,transparent);
  --raised50:color-mix(in srgb,var(--color-raised) 50%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-app);color:var(--color-ink);font-family:var(--font-sans);font-size:16px;color-scheme:var(--code-color-scheme)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible,.focus-demo{outline:2px solid var(--color-focus);outline-offset:2px}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ── mock chrome (not part of the product) ── */
.mockbar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 20px;background:var(--color-panel);border-bottom:1px solid var(--hair40);font-size:13px;color:var(--color-ink-secondary)}
.mockbar b{color:var(--color-ink)}
.mockbar button{border:1px solid var(--hair40);border-radius:8px;padding:4px 10px;color:var(--color-ink)}
.mockbar a{color:var(--color-accent-text)}
.stage{display:flex;flex-direction:column;gap:36px;padding:28px 20px 80px;align-items:flex-start}
.cap{font-size:13px;color:var(--color-ink-secondary);margin:0 0 8px;max-width:1280px}
.cap b{color:var(--color-ink)}
.phones{display:flex;flex-wrap:wrap;gap:24px}
body.only .mockbar,body.only .cap{display:none}
body.only .stage{padding:0;gap:0}
body.only .win,body.only .phone{border:0;border-radius:0}

/* ── app shell at real size ── */
.win{width:1280px;height:800px;display:flex;border:1px solid var(--hair40);border-radius:12px;overflow:hidden;background:var(--color-app)}
.phone{width:390px;height:844px;display:flex;border:1px solid var(--hair40);border-radius:28px;overflow:hidden;background:var(--color-app)}
.side{width:264px;flex:none;background:var(--color-panel);border-right:1px solid var(--hair40);padding:12px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.side h4{margin:10px 8px 6px;font-size:11px;font-weight:600;color:var(--color-ink-secondary);letter-spacing:.02em}
.bot{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:var(--color-ink)}
.bot.on{background:var(--color-raised)}
.bot small{display:block;font-size:12px;color:var(--color-ink-secondary)}
.av{flex:none;border-radius:8px;display:grid;place-items:center;font-weight:700;color:var(--color-accent-ink);background:var(--color-accent)}
.av.s28{width:28px;height:28px;font-size:12px}.av.s36{width:36px;height:36px;font-size:14px}.av.s40{width:40px;height:40px;font-size:15px}
.av.k{background:#82b5ef;color:#0a1a2c}.av.n{background:var(--color-success);color:var(--color-app)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;container-type:inline-size;container-name:chat}
.hdr{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--hair30)}
.hdr .nm{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .sub{font-size:12px;color:var(--color-ink-secondary)}
.hdr .sp{flex:1}
.stop{display:flex;align-items:center;gap:6px;border-radius:9999px;border:1px solid var(--hair40);background:color-mix(in srgb,var(--color-raised) 60%,transparent);padding:4px 10px;font-size:13px;color:var(--color-ink-secondary)}
.log{flex:1;min-height:0;overflow:hidden;padding:16px 20px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.bub{width:fit-content;max-width:min(52rem,84%);border-radius:16px;padding:10px 16px;font-size:15px;line-height:1.625}
.bub.u{align-self:flex-end;background:var(--color-bubble-user)}
.bub.a{background:var(--color-card)}
.speaker{font-size:11px;font-weight:500;color:var(--color-ink-secondary);padding-left:2px;margin-bottom:-6px}
.dock{padding:0 20px 14px}
.composer{display:flex;align-items:center;gap:6px;background:var(--color-raised);border-radius:24px;padding:8px 10px 8px 16px;font-size:15px;color:var(--color-ink-secondary)}
.composer .ph{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:32px;height:32px;border-radius:9999px;display:grid;place-items:center;flex:none}
.round.send{background:var(--color-accent);color:var(--color-accent-ink)}

/* ── existing app parts drawn for context (unchanged by this design) ── */
.waitrow{display:flex;width:100%;max-width:840px;align-items:center;gap:10px;border-radius:12px;border:1px solid var(--accent40);background:var(--color-card);padding:6px 6px 6px 14px;font-size:14px}
.waitrow .d{width:8px;height:8px;border-radius:9999px;background:var(--color-accent);flex:none}
.waitrow .t{flex:1;min-width:0}
.waitrow button{min-height:44px;display:inline-flex;align-items:center;border-radius:8px;border:1px solid var(--accent40);padding:0 12px;color:var(--color-accent)}
.approval{margin-bottom:8px;border-radius:16px;border:1px solid var(--accent40);background:var(--color-card);overflow:hidden}
.approval .b{padding:14px 16px 4px}
.approval h5{margin:0 0 4px;font-size:15px;font-weight:600}
.approval p{margin:0;font-size:13px;color:var(--color-ink-secondary);line-height:1.5}
.approval .acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:6px 16px 12px}
.approval .acts button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;padding:6px 14px;font-size:13.5px}
.approval .allow{background:var(--color-accent);color:var(--color-accent-ink);font-weight:500}
.approval .deny{border:1px solid var(--danger40);color:var(--color-danger)}
.approval .cancel{color:var(--color-ink-secondary)}

/* ══ StepsGroup (the design) ══ */
.sg{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;max-width:min(40rem,100%)}
.sg-head{display:flex;align-items:flex-start;gap:8px;max-width:100%;min-width:0}
.sg-headcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;max-width:100%;border-radius:9999px;border:1px solid var(--hair40);background:var(--color-panel);padding:6px 12px;font-size:13px;line-height:20px;color:var(--color-ink-secondary)}
.pill:hover{background:var(--color-control)}
.pill .segs{display:flex;flex-wrap:wrap;column-gap:6px;min-width:0}
.pill .seg{white-space:nowrap}
.pill .phase{color:var(--color-ink)}
.pill .dots{color:var(--color-accent-text)}
.pill .ok{color:var(--color-success)}
.pill .bad{color:var(--color-danger)}
.pill .chev,.row .chev{transition:transform .12s}
[aria-expanded="true"]>.chev{transform:rotate(90deg)}
.pill.waiting{background:var(--color-warning-soft);border-color:var(--warning40);color:var(--color-warning)}
.pill.waiting .phase{color:var(--color-warning);font-weight:500}
.dots{display:inline-flex;align-items:center;gap:4px;flex:none}
.dots i{width:3.5px;height:3.5px;border-radius:9999px;background:currentColor;animation:status-pulse 1.6s steps(2,jump-none) infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes status-pulse{0%,100%{opacity:.25}30%{opacity:1}60%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}.chev{transition:none}}
.now{height:20px;line-height:20px;padding-left:13px;font-size:13px;color:var(--color-ink-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.now b,.row b{font-weight:600;color:var(--color-ink)}
.now.amber{color:var(--color-warning)}.now.amber b{color:var(--color-warning)}
.list{width:100%;display:flex;flex-direction:column;gap:1px}
.list[hidden],.detail[hidden],.kids[hidden]{display:none}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto 14px;column-gap:8px;align-items:center;width:100%;padding:5px 8px;border-radius:8px;font-size:13px;line-height:20px;color:var(--color-ink-secondary)}
button.row:hover{background:var(--raised50)}
.row .ic{display:grid;place-items:center;height:20px}
.row .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{font-size:12px;white-space:nowrap}
.row .stat .p{color:var(--color-success)}.row .stat .m{color:var(--color-danger)}
.row .sub{grid-column:2/4;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub.amber{color:var(--color-warning)}
.row.run .ic,.row.run .rt{color:var(--color-accent-text)}
.row.fail .ic,.row.fail .rt{color:var(--color-danger)}.row.fail .rt{font-weight:500}
.row.wait .ic,.row.wait .rt{color:var(--color-warning)}.row.wait .rt{font-weight:500}
.row.nochev{grid-template-columns:20px minmax(0,1fr) auto 14px}
.note{padding:4px 8px 4px 36px;font-size:13px;line-height:20px;color:var(--color-ink-secondary)}
.more{margin:2px 0 2px 28px;padding:4px 8px;border-radius:8px;font-size:12px;color:var(--color-ink-secondary)}
.more:hover{background:var(--raised50);color:var(--color-ink)}
.kids{margin-left:20px;padding-left:8px;border-left:1px solid var(--hair40);display:flex;flex-direction:column;gap:1px}
.sum{padding:2px 8px 4px 36px;font-size:12px;line-height:18px;color:var(--color-ink-secondary)}
.row .res{font-size:12px}
.planline{width:100%}
.checks{list-style:none;margin:2px 0 6px 36px;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.375;color:var(--color-ink-secondary)}
.checks[hidden]{display:none}
.checks li{display:flex;gap:8px;align-items:flex-start}.checks li svg{margin-top:3px}
.checks li.done span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--color-ink-secondary) 50%,transparent)}
.checks li.done svg{color:var(--color-success)}.checks li.cur{color:var(--color-ink)}.checks li.cur svg{color:var(--color-accent)}
.nl{padding:6px 8px 2px 36px;font-size:12px;line-height:18px;color:var(--color-ink-secondary)}
.nl a{color:var(--color-accent-text);text-decoration:none}
.detail{margin:4px 0 8px 36px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:6px;border:1px solid var(--hair40);background:var(--color-raised);padding:1px 6px;font-size:11px;font-weight:500;color:var(--color-ink)}
.chip span{color:var(--color-ink-secondary);font-weight:400}
.foot{font-size:11px;line-height:16px;color:var(--color-ink-secondary)}
/* the app's shared code block (ChatMarkdown) */
.cb{overflow:hidden;border-radius:8px;border:1px solid var(--hair40);background:var(--color-inset)}
.cb.err{border-left:3px solid var(--color-danger)}
.cb-h{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair30);background:var(--raised30);padding:6px 12px}
.cb-h+pre+.cb-h{border-top:1px solid var(--hair30)}
.cb-l{border-radius:4px;border:1px solid var(--hair40);background:var(--color-raised);padding:2px 6px;font-size:11px;font-weight:500;color:var(--color-ink)}
.cb-c{font-size:11px;color:var(--color-ink-secondary);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-sp{flex:1}
.cb-b{display:flex;min-height:32px;align-items:center;gap:4px;border-radius:4px;padding:0 8px;font-size:11px;color:var(--color-ink-secondary)}
.cb-b:hover{background:var(--color-raised);color:var(--color-ink)}
.cb pre{margin:0;padding:12px;font-family:var(--font-mono);font-size:13px;line-height:1.625;color:var(--color-ink);overflow-x:auto;white-space:pre}
.cb.wrap pre{white-space:pre-wrap;overflow-wrap:anywhere}
.cb .kw{color:var(--sk-kw)}.cb .st{color:var(--sk-str)}.cb .cm{color:var(--sk-com)}.cb .fn{color:var(--sk-fn)}.cb .nu{color:var(--sk-num)}
.cb .dim{color:var(--color-ink-secondary)}
.cb .mask{background:var(--color-control);border-radius:3px;padding:0 3px;color:var(--color-ink-secondary)}
.cb-f{display:flex;align-items:center;gap:10px;border-top:1px solid var(--hair30);padding:4px 12px;font-size:11px;color:var(--color-ink-secondary)}
.cb-f .exit{color:var(--color-danger);font-weight:500}
.cb-f button{min-height:28px;color:var(--color-accent-text)}
.diff{padding:8px 0!important}
.diff span{display:block;padding:0 12px 0 0}
.diff span::before{content:attr(data-g);display:inline-block;width:28px;text-align:center;color:var(--color-ink-secondary)}
.diff .add{background:var(--color-success-soft)}.diff .add::before{color:var(--color-success)}
.diff .del{background:var(--color-danger-soft)}.diff .del::before{color:var(--color-danger)}
.diff .gap{color:var(--color-ink-secondary);font-family:var(--font-sans);font-size:11px;padding:2px 12px 2px 28px}
.diff .gap::before{content:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ── phone width: the app's breakpoint is max-width 767.98px ── */
@container chat (max-width:767.98px){
  .hdr{padding:10px 12px}.log{padding:12px 12px 10px}.dock{padding:0 12px 12px}
  .bub{max-width:100%}
  .row{min-height:44px;padding:4px 6px}
  .row.two{grid-template-rows:auto auto;row-gap:0;align-content:center}
  .row.two .rt{grid-column:2/3;grid-row:2;justify-self:start}
  .row.two .chev{grid-column:4;grid-row:1}
  .pill{min-height:44px;border-radius:22px}
  .pill .brk{flex-basis:100%;height:0}
  .detail{margin-left:0}
  .kids{margin-left:10px}
  .cb pre{white-space:pre-wrap;overflow-wrap:anywhere}
  .cb-b .lb{display:none}
  .composer{border-radius:26px}
}
</style>
</head>
<body>
<div class="mockbar">
  <b>Steps view r3</b><span>Murage 1.0.22 mockup · real app size · tokens from src/styles.css</span>
  <button type="button" id="skinbtn">Switch to Light</button>
  <span>Keyboard: Tab to a pill, Enter opens, ↑ ↓ Home End move, Enter opens a row, Esc closes.</span>
</div>
<div class="stage" id="stage"></div>
<div class="sr" aria-live="polite" id="live"></div>

/* one step row. st: done|run|fail|wait|deny|stop|none ; a11y = status word spoken first */
function row(st,icon,html,right,detail,opt={}){
  const id='d'+(++uid);
  const ic={run:dots,fail:I('x'),wait:I('pause'),deny:I('ban'),stop:I('square'),none:I('minus')}[st]||I(icon);
  const cls={run:'run',fail:'fail',wait:'wait'}[st]||'';
  const say={done:'Done',run:'Running',fail:'Failed',wait:(right||'Waiting for your OK'),deny:'Not allowed',stop:'Stopped',none:'No result'}[st];
  const sub=opt.sub?`<span class="sub ${opt.subAmber?'amber':''}">${opt.sub}</span>`:'';
  const inner=`<span class="ic">${ic}</span><span class="tx"><span class="sr">${say}. </span>${html}</span><span class="rt num">${right||''}</span>`;
  if(!detail&&!opt.kids) return `<div class="row nochev ${cls} ${opt.two?'two':''}" role="listitem">${inner}<span></span>${sub}</div>`;
  return `<div role="listitem"><button type="button" class="row ${cls} ${opt.two?'two':''} ${opt.focus?'focus-demo':''}" aria-expanded="${opt.open?'true':'false'}" aria-controls="${id}" tabindex="${opt.tab?0:-1}">${inner}${I('chev',13).replace('class="i"','class="i chev"')}${sub}</button>
  <${opt.checks?'ul':'div'} id="${id}" class="${opt.kids?'kids':opt.checks?'checks':'detail'}" ${opt.open?'':'hidden'}>${detail||opt.kids}</${opt.checks?'ul':'div'}></div>`;
}

else{
  stage.innerHTML=Object.values(SCREENS).map(s=>`<div><p class="cap">${s.cap}</p>${s.html()}</div>`).join('')+
   `<div><p class="cap"><b>9. Phone width (390).</b> One line per row; only a waiting, failed or not-allowed row may take a second line, on the text column. Header segments never break inside. Panes open full width and wrap. 44 px rows.</p><div class="phones">${Object.values(PHONES).map(s=>s.html()).join('')}</div></div>`;
}
const sb=document.getElementById('skinbtn');
sb.textContent=skin==='dark'?'Switch to Light':'Switch to Dark';
sb.onclick=()=>{q.set('skin',skin==='dark'?'light':'dark');location.search=q.toString();};

/* ── behaviour: native buttons, roving focus, Esc, Copy, Wrap, live clock ── */
const say=t=>{document.getElementById('live').textContent=t;};
function toggle(btn,force){const open=force!==undefined?force:btn.getAttribute('aria-expanded')!=='true';btn.setAttribute('aria-expanded',open);const t=document.getElementById(btn.getAttribute('aria-controls'));if(t)t.hidden=!open;return open;}
const rowsOf=list=>[...list.querySelectorAll('button.row, button.more')].filter(b=>b.offsetParent!==null);
function focusRow(list,b){rowsOf(list).forEach(x=>x.tabIndex=-1);if(b){b.tabIndex=0;b.focus();}}
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act,cb=act.closest('.cb');
    if(a==='copy'){const h=act.closest('.cb-h');let pre=h&&h.nextElementSibling;const text=pre?pre.innerText:'';(navigator.clipboard?navigator.clipboard.writeText(text).catch(()=>{}):Promise.resolve());const s=act.querySelector('span:last-child');s.textContent='Copied';say('Copied');setTimeout(()=>s.textContent='Copy',1500);}
    if(a==='wrap'&&cb){cb.classList.toggle('wrap');}
    if(a==='all'){act.textContent='Showing all lines';}
    if(a==='answer'){const b=document.getElementById('allowbtn');if(b)b.focus();}
    return;}
  const pill=e.target.closest('button.pill');
  if(pill&&pill.getAttribute('aria-controls')!=='x'){
    const open=toggle(pill);const list=document.getElementById(pill.getAttribute('aria-controls'));if(open&&list){const r=rowsOf(list);r.forEach((x,i)=>x.tabIndex=i?-1:0);}return;}
  const r=e.target.closest('button.row');if(r){toggle(r);}
});
document.addEventListener('keydown',e=>{
  const b=e.target.closest&&e.target.closest('button.row, button.more');
  const list=b&&b.closest('.list');
  if(b&&list){const all=rowsOf(list),i=all.indexOf(b);
    const go=n=>{e.preventDefault();focusRow(list,all[Math.max(0,Math.min(all.length-1,n))]);};
    if(e.key==='ArrowDown')go(i+1);else if(e.key==='ArrowUp')go(i-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(all.length-1);
    else if(e.key==='ArrowRight'&&b.matches('.row')){e.preventDefault();toggle(b,true);}
    else if(e.key==='ArrowLeft'&&b.matches('.row')){e.preventDefault();toggle(b,false);}
    else if(e.key==='Escape'){e.preventDefault();const p=document.querySelector(`button.pill[aria-controls="${list.id}"]`);if(p){toggle(p,false);p.focus();}}
  }
  if(e.key==='ArrowDown'&&e.target.matches&&e.target.matches('button.pill[aria-expanded="true"]')){const l=document.getElementById(e.target.getAttribute('aria-controls'));if(l){e.preventDefault();focusRow(l,rowsOf(l)[0]);}}
});
document.querySelectorAll('.list:not([hidden])').forEach(l=>{const r=rowsOf(l);if(r[0])r[0].tabIndex=0;});
/* one shared 1 s ticker; the format is the app's formatElapsed */
const fmt=s=>s<60?`${s}s`:s<3600?`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`:`${Math.floor(s/3600)}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m`;
if(!q.has('still'))setInterval(()=>document.querySelectorAll('[data-clock]').forEach(n=>{n.dataset.clock=+n.dataset.clock+1;n.textContent=fmt(+n.dataset.clock);}),1000);
</script>
